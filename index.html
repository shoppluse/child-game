<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECHO-7: The Awakening</title>
    <style>
        /* =========================================================
           GLOBAL STYLING & THRILLER THEME
           ========================================================= */
        :root {
            --bg-color: #07070a;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --text-accent: #38bdf8;
            --text-danger: #ef4444;
            --border-color: #1e293b;
            --ui-bg: rgba(15, 23, 42, 0.85);
            --font-serif: 'Georgia', serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: 'Arial', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-serif);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Ambient FX Layer */
        #fx-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            opacity: 0.8;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 50%, #000 150%);
            z-index: 9;
            pointer-events: none;
        }

        /* =========================================================
           SCREENS
           ========================================================= */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background-color: var(--bg-color);
            transition: opacity 1s ease;
        }

        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* Main Menu */
        #main-menu h1 {
            font-family: var(--font-sans);
            font-size: 3rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        #main-menu h3 {
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--text-muted);
            margin-bottom: 50px;
        }

        .btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 12px 24px;
            font-family: var(--font-sans);
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 250px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .btn:hover, .btn:focus {
            color: #fff;
            border-color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            letter-spacing: 4px;
        }
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* =========================================================
           GAME UI
           ========================================================= */
        #game-ui {
            z-index: 15;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            height: 100%;
            padding: 20px;
            background: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .threat-high { color: var(--text-danger); animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #story-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        #story-text {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 40px;
            white-space: pre-wrap;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        #choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .choice-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px 20px;
            font-family: var(--font-sans);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .choice-btn::before {
            content: "▸";
            margin-right: 10px;
            color: var(--text-accent);
        }
        .choice-btn:hover {
            background: var(--text-main);
            color: var(--bg-color);
        }

        footer {
            display: flex;
            justify-content: space-around;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .nav-btn {
            background: none; border: none; 
            color: var(--text-muted);
            cursor: pointer; 
            font-family: var(--font-mono);
            letter-spacing: 1px; 
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .nav-btn:hover { color: var(--text-accent); }
        .nav-btn.alert { color: var(--text-danger); animation: pulse 1s infinite; }

        /* =========================================================
           MODALS (Phone, Evidence, Journal)
           ========================================================= */
        .modal {
            position: absolute;
            top: 5%; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 400px;
            height: 90%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .modal-header {
            background: #111;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-sans);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem;
        }

        .modal-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
        }

        /* Phone UI Styling */
        .sms-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            line-height: 1.4;
            clear: both;
        }
        .sms-received {
            background: #1e293b;
            color: #fff;
            float: left;
            border-bottom-left-radius: 2px;
        }
        .sms-sent {
            background: #0284c7;
            color: #fff;
            float: right;
            border-bottom-right-radius: 2px;
        }
        .sms-sender { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 5px; clear: both;}

        /* Evidence Board Styling */
        .evidence-card {
            background: #111;
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 3px solid var(--text-accent);
        }
        .evidence-title { font-weight: bold; color: var(--text-main); margin-bottom: 5px; font-family: var(--font-mono); }
        .evidence-desc { color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); }

    </style>
</head>
<body>

    <!-- FX Layer -->
    <div id="fx-layer"></div>
    <div class="vignette"></div>

    <!-- MAIN MENU -->
    <div id="main-menu" class="screen">
        <h1>THE TRUTH</h1>
        <h3>BEHIND THE FALL</h3>
        <button class="btn" onclick="UI.startGame()">New Investigation</button>
        <button class="btn" id="btn-continue" onclick="UI.loadGame()">Continue</button>
        <button class="btn" onclick="UI.showCredits()">Case Files (Credits)</button>
        <div style="margin-top: 40px; font-family: monospace; font-size: 0.7rem; color: #333;">SYSTEM v1.0.4 | LOCAL STORAGE ENABLED</div>
    </div>

    <!-- CREDITS SCREEN -->
    <div id="credits-screen" class="screen hidden">
        <h2>CASE ARCHIVES</h2>
        <br>
        <p style="text-align:center; color:gray; line-height:2;">
            Story Adaptation: ECHO-7 Thriller<br>
            Audio Engine: Web Audio API Synthesizer<br>
            Graphics: Procedural CSS<br>
            Engine: Vanilla HTML5/JS
        </p>
        <br>
        <button class="btn" onclick="UI.hideCredits()">Return</button>
    </div>

    <!-- GAME UI -->
    <div id="game-ui" class="screen hidden">
        <header>
            <div id="hud-chapter">Prologue</div>
            <div id="hud-threat">Threat Level: LOW</div>
            <div id="hud-time">03:47 AM</div>
        </header>

        <div id="story-container">
            <div id="story-text"></div>
            <div id="choices-container"></div>
        </div>

        <footer>
            <button class="nav-btn" id="btn-phone" onclick="Modals.open('phone')">📱 Phone</button>
            <button class="nav-btn" id="btn-evidence" onclick="Modals.open('evidence')">🗂 Evidence</button>
            <button class="nav-btn" id="btn-journal" onclick="Modals.open('journal')">📓 Journal</button>
            <button class="nav-btn" onclick="Engine.saveGame()">💾 Save</button>
        </footer>
    </div>

    <!-- MODALS -->
    <!-- Phone Modal -->
    <div id="modal-phone" class="modal hidden">
        <div class="modal-header">
            <span>SECURE MESSAGES</span>
            <button class="close-btn" onclick="Modals.close()">×</button>
        </div>
        <div class="modal-content" id="phone-content"></div>
    </div>

    <!-- Evidence Modal -->
    <div id="modal-evidence" class="modal hidden">
        <div class="modal-header">
            <span>EVIDENCE BOARD</span>
            <button class="close-btn" onclick="Modals.close()">×</button>
        </div>
        <div class="modal-content" id="evidence-content"></div>
    </div>

    <!-- Journal Modal -->
    <div id="modal-journal" class="modal hidden">
        <div class="modal-header">
            <span>INVESTIGATION NOTES</span>
            <button class="close-btn" onclick="Modals.close()">×</button>
        </div>
        <div class="modal-content" id="journal-content"></div>
    </div>

<script>
/**
 * =========================================================
 * AUDIO ENGINE (Web Audio API)
 * Procedural generation of thriller sounds
 * =========================================================
 */
const AudioEngine = {
    ctx: null,
    masterGain: null,
    droneOsc: null,

    init() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.4;
        this.masterGain.connect(this.ctx.destination);
        this.startDrone();
    },

    startDrone() {
        // Low ambient thriller drone
        this.droneOsc = this.ctx.createOscillator();
        this.droneOsc.type = 'sine';
        this.droneOsc.frequency.value = 45; 
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 100;

        const lfo = this.ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.05;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 30;

        lfo.connect(lfoGain).connect(filter.frequency);
        this.droneOsc.connect(filter).connect(this.masterGain);
        
        this.droneOsc.start();
        lfo.start();
    },

    playType() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain).connect(this.masterGain);
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(400 + Math.random() * 200, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.start(); osc.stop(this.ctx.currentTime + 0.05);
    },

    playNotification() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain).connect(this.masterGain);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.start(); osc.stop(this.ctx.currentTime + 0.5);
    },

    playTension() {
        if (!this.ctx || !this.droneOsc) return;
        // Pitch up drone slightly for tension
        this.droneOsc.frequency.rampTo(55, 2);
    }
};

/**
 * =========================================================
 * GAME STATE MANAGEMENT
 * =========================================================
 */
let gameState = {
    currentNode: 'prologue_start',
    chapter: 'Prologue',
    time: '03:47 AM',
    threatLevel: 0,
    inventory: [],
    evidence: [],
    messages: [],
    journal: [],
    flags: {
        trustVikram: 0,
        trustSana: 0,
        policeInvolved: false
    }
};

const Engine = {
    saveGame() {
        localStorage.setItem('echo7_save', JSON.stringify(gameState));
        UI.flashNav('💾 Save');
    },
    loadGame() {
        const saved = localStorage.getItem('echo7_save');
        if (saved) {
            gameState = JSON.parse(saved);
            return true;
        }
        return false;
    },
    hasSave() {
        return localStorage.getItem('echo7_save') !== null;
    },
    addEvidence(id, title, desc) {
        if (!gameState.evidence.find(e => e.id === id)) {
            gameState.evidence.push({id, title, desc});
            document.getElementById('btn-evidence').classList.add('alert');
            AudioEngine.playNotification();
        }
    },
    addMessage(sender, text, isReceived = true) {
        gameState.messages.push({sender, text, isReceived});
        document.getElementById('btn-phone').classList.add('alert');
        if(isReceived) AudioEngine.playNotification();
    },
    addJournal(entry) {
        if(!gameState.journal.includes(entry)){
            gameState.journal.push(entry);
            document.getElementById('btn-journal').classList.add('alert');
        }
    }
};

/**
 * =========================================================
 * USER INTERFACE & MODALS
 * =========================================================
 */
const Modals = {
    active: null,
    open(type) {
        AudioEngine.playType();
        this.close();
        document.getElementById(`modal-${type}`).classList.remove('hidden');
        document.getElementById(`btn-${type}`).classList.remove('alert');
        this.active = type;
        this.populate(type);
    },
    close() {
        if (this.active) {
            document.getElementById(`modal-${this.active}`).classList.add('hidden');
            this.active = null;
        }
    },
    populate(type) {
        const container = document.getElementById(`${type}-content`);
        container.innerHTML = '';

        if (type === 'phone') {
            if(gameState.messages.length === 0) container.innerHTML = '<p style="color:gray;text-align:center;">No messages.</p>';
            gameState.messages.forEach(msg => {
                const alignClass = msg.isReceived ? 'sms-received' : 'sms-sent';
                const senderDiv = msg.isReceived ? `<div class="sms-sender">${msg.sender}</div>` : '';
                container.innerHTML += `
                    ${senderDiv}
                    <div class="sms-bubble ${alignClass}">${msg.text}</div>
                `;
            });
        } 
        else if (type === 'evidence') {
            if(gameState.evidence.length === 0) container.innerHTML = '<p style="color:gray;text-align:center;">Board empty.</p>';
            gameState.evidence.forEach(ev => {
                container.innerHTML += `
                    <div class="evidence-card">
                        <div class="evidence-title">${ev.title}</div>
                        <div class="evidence-desc">${ev.desc}</div>
                    </div>
                `;
            });
        }
        else if (type === 'journal') {
            if(gameState.journal.length === 0) container.innerHTML = '<p style="color:gray;text-align:center;">No entries yet.</p>';
            gameState.journal.forEach(entry => {
                container.innerHTML += `<p style="margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid #1e293b;">- ${entry}</p>`;
            });
        }
    }
};

const UI = {
    typingTimer: null,

    init() {
        if(Engine.hasSave()) {
            document.getElementById('btn-continue').disabled = false;
        } else {
            document.getElementById('btn-continue').disabled = true;
        }
    },
    startGame() {
        AudioEngine.init();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        gameState = {
            currentNode: 'prologue_start', chapter: 'Prologue', time: '03:47 AM', threatLevel: 0,
            inventory: [], evidence: [], messages: [], journal: [], flags: {trustVikram:0, trustSana:0, policeInvolved:false}
        };
        StoryEngine.renderNode(gameState.currentNode);
    },
    loadGame() {
        AudioEngine.init();
        if(Engine.loadGame()) {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            StoryEngine.renderNode(gameState.currentNode, true);
        }
    },
    showCredits() {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('credits-screen').classList.remove('hidden');
    },
    hideCredits() {
        document.getElementById('credits-screen').classList.add('hidden');
        document.getElementById('main-menu').classList.remove('hidden');
    },
    flashNav(text) {
        const btns = document.querySelectorAll('.nav-btn');
        const saveBtn = btns[3];
        saveBtn.innerText = "[ SAVED ]";
        setTimeout(() => saveBtn.innerText = text, 2000);
    },
    updateHUD() {
        document.getElementById('hud-chapter').innerText = gameState.chapter;
        document.getElementById('hud-time').innerText = gameState.time;
        
        const threatEl = document.getElementById('hud-threat');
        if (gameState.threatLevel > 50) {
            threatEl.innerText = "Threat Level: CRITICAL";
            threatEl.className = "threat-high";
            AudioEngine.playTension();
        } else if (gameState.threatLevel > 20) {
            threatEl.innerText = "Threat Level: ELEVATED";
            threatEl.className = "";
        } else {
            threatEl.innerText = "Threat Level: LOW";
            threatEl.className = "";
        }
    },
    typeText(text, callback) {
        const container = document.getElementById('story-text');
        container.innerHTML = '';
        let i = 0;
        clearTimeout(this.typingTimer);

        function type() {
            if (i < text.length) {
                // Handle basic HTML line breaks
                if(text.charAt(i) === '<' && text.substring(i, i+4) === '<br>') {
                    container.innerHTML += '<br>';
                    i += 4;
                } else {
                    container.innerHTML += text.charAt(i);
                    i++;
                }
                
                if (i % 3 === 0) AudioEngine.playType();
                UI.typingTimer = setTimeout(type, 15);
            } else {
                if(callback) callback();
            }
        }
        type();
    }
};

/**
 * =========================================================
 * STORY ENGINE & NARRATIVE DATA
 * =========================================================
 */
const StoryNodes = {
    // PROLOGUE
    "prologue_start": {
        chapter: "Prologue", time: "03:47 AM",
        text: "Your phone wakes you at 3:47 AM.<br><br>Not an alarm. Not a call. A text from a number you don't recognise — eleven digits, no country code, no name. The screen glows in the dark of your flat in Koramangala. Your ceiling fan hums. Somewhere outside, a dog barks twice and stops.",
        onEnter: () => {
            Engine.addMessage("Unknown Sender", "He told us you'd delete this. Don't. Your brother didn't fall.");
            Engine.addJournal("Received a strange text at 3:47 AM about Arjun's death.");
        },
        choices: [
            { text: "Read the message on your Phone.", next: "prologue_read" }
        ]
    },
    "prologue_read": {
        chapter: "Prologue", time: "03:49 AM",
        text: "You sit up. Your mouth is dry.<br><br>Your brother Arjun died eight months ago. The police report said he fell from the terrace of his apartment building in Whitefield. Sixth floor. The investigation lasted eleven days and was closed with a single word: accidental.<br><br>You believed them. You had no reason not to.",
        choices: [
            { text: "Reply: 'Who is this?'", next: "prologue_reply" },
            { text: "Put the phone away and try to sleep.", next: "prologue_ignore" }
        ]
    },
    "prologue_reply": {
        chapter: "Prologue", time: "03:51 AM",
        text: "You stare at the message until the screen dims. Then you type back: 'Who is this?'<br><br>Three dots appear. Then they vanish. No reply comes.<br><br>You don't sleep again.",
        onEnter: () => Engine.addMessage("You", "Who is this?", false),
        choices: [ { text: "Wait until morning.", next: "ch1_start" } ]
    },
    "prologue_ignore": {
        chapter: "Prologue", time: "05:00 AM",
        text: "You try to close your eyes, but the words burn in your mind. 'Your brother didn't fall.'<br><br>You don't sleep again.",
        choices: [ { text: "Wait until morning.", next: "ch1_start" } ]
    },

    // CHAPTER 1
    "ch1_start": {
        chapter: "Chapter 1", time: "09:12 AM",
        text: "You go to the building. Arjun's building. You tell yourself it's just to look. Just to stand where he stood.<br><br>The security guard at the gate is new. He lets you sign in without asking why. The visitor log has your name in it already. You didn't write it.<br><br>You ask him about this. He says, quietly, 'Sir wrote your name last week. Said his sister would come.'<br><br>Sir. Arjun. Last week. Eight months after he died.",
        onEnter: () => Engine.addEvidence("visitor_log", "Visitor Log", "Arjun wrote my name in the security log a week ago. 8 months after his death."),
        choices: [ { text: "Take the lift to his floor.", next: "ch1_door" } ]
    },
    "ch1_door": {
        chapter: "Chapter 1", time: "09:15 AM",
        text: "You take the lift to the sixth floor. The door to his flat is sealed with police tape. Nobody has touched this place. And yet, slid under the door, there is an envelope.<br><br>Cream-coloured. No stamp. Your name written on the front in his handwriting.",
        choices: [ { text: "Open the envelope.", next: "ch1_note" } ]
    },
    "ch1_note": {
        chapter: "Chapter 1", time: "09:16 AM",
        text: "Inside is a handwritten note:<br><br>'Priya. Don't go to the police. They are the problem. Go to the parking lot on level B2. White Honda City, KA-03-MF-4421. The man inside is the only one who knows everything. Tell him I sent you. He will be afraid. That's okay. So am I.'",
        onEnter: () => Engine.addEvidence("arjun_note", "Arjun's Letter", "Instructs me to find a man in a white Honda City on level B2. Warns against police."),

const StoryEngine = {
    renderNode(nodeId, skipType = false) {
        gameState.currentNode = nodeId;
        const node = StoryNodes[nodeId];
        
        if (node.onEnter) node.onEnter();

        gameState.chapter = node.chapter || gameState.chapter;
        gameState.time = node.time || gameState.time;
        UI.updateHUD();

        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = ''; // Clear choices during typing

        if (skipType) {
            document.getElementById('story-text').innerHTML = node.text.replace(/<br>/g, '<br>');
            this.renderChoices(node.choices);
        } else {
            UI.typeText(node.text, () => {
                this.renderChoices(node.choices);
            });
        }
    },
    renderChoices(choices) {
        const container = document.getElementById('choices-container');
        container.innerHTML = '';
        if(!choices) return;
        
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = c.text;
            btn.onclick = () => {
                AudioEngine.playType();
                this.renderNode(c.next);
            };
            container.appendChild(btn);
        });
    }
};

// Start UI Initialization
window.onload = () => { UI.init(); };
