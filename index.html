<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magical Forest Party</title>
    <style>
        /* CSS Styling for UI and Game Container */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1b2a;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(13, 27, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        .panel {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            max-width: 80%;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 4rem;
            margin: 0 0 20px 0;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff, 0 0 40px #ffd700;
            letter-spacing: 2px;
        }

        h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            text-shadow: 0 0 15px #ffd700;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Fredoka One', cursive;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.5);
            transition: transform 0.2s, filter 0.2s;
            margin: 10px;
        }

        .btn:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            text-align: left;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
        }

        .control-item span {
            font-weight: bold;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .score-board {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .player-score {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 2px solid transparent;
            backdrop-filter: blur(4px);
        }

        #timer-container {
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: white;
            text-shadow: 0 0 20px #ffd700;
            text-align: center;
        }

        #event-banner {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            font-family: 'Fredoka One', cursive;
            font-size: 3rem;
            color: white;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .show-banner {
            transform: translateX(-50%) scale(1) !important;
        }

    </style>
</head>
<body>

<div id="game-container">
    <div id="hud" class="hidden">
        <div class="score-board" id="left-scores">
            </div>
        <div id="timer-container">
            <div id="time-left">2:00</div>
        </div>
        <div class="score-board" id="right-scores">
            </div>
        <div id="event-banner">Star Frenzy!</div>
    </div>

    <div id="start-screen" class="screen">
        <div class="panel">
            <h1>Magical Forest<br>Party</h1>
            <p>Gather your friends! Run, jump, and collect glowing magic stars!</p>
            <div class="controls-grid">
                <div class="control-item" style="color: #ff69b4;">🐰 P1 (Bunny): <span>W A S D</span></div>
                <div class="control-item" style="color: #ffa500;">🐅 P2 (Tiger): <span>Arrows</span></div>
                <div class="control-item" style="color: #00bfff;">🐘 P3 (Elephant): <span>I J K L</span></div>
                <div class="control-item" style="color: #32cd32;">🦌 P4 (Deer): <span>T F G H</span></div>
            </div>
            <h3>How many players?</h3>
            <div>
                <button class="btn" onclick="startGame(2)">2 Players</button>
                <button class="btn" onclick="startGame(3)">3 Players</button>
                <button class="btn" onclick="startGame(4)">4 Players</button>
            </div>
        </div>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <div class="panel">
            <h2>Party Over!</h2>
            <h1 id="winner-text">Player 1 Wins!</h1>
            <div id="final-scores" style="font-size: 1.5rem; margin-bottom: 20px;"></div>
            <button class="btn" onclick="resetToMenu()">Play Again</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    /** --- AUDIO SYSTEM (Web Audio API) --- */
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'collect') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600 + Math.random() * 400, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'event') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554, now + 0.1);
            osc.frequency.setValueAtTime(659, now + 0.2);
            osc.frequency.setValueAtTime(880, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else if (type === 'win') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.setValueAtTime(659.25, now + 0.2); // E5
            osc.frequency.setValueAtTime(783.99, now + 0.4); // G5
            osc.frequency.setValueAtTime(1046.50, now + 0.6); // C6
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 1.5);
            osc.start(now); osc.stop(now + 1.5);
        }
    }

    /** --- ENGINE SETUP --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let cw, ch;
    function resize() {
        cw = canvas.width = window.innerWidth;
        ch = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Input handling
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    /** --- GAME STATE --- */
    let gameState = 'menu'; // menu, playing, gameover
    let players = [];
    let entities = [];
    let particles = [];
    let bgParticles = [];
    let gameTimer = 120; // 2 minutes
    let lastTime = 0;
    let eventTimer = 20; // Event every 20 seconds
    let activeEvent = null;

    const PLAYER_CONFIGS = [
        { id: 1, name: 'Bunny', color: '#ff69b4', up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', animal: 'bunny' },
        { id: 2, name: 'Tiger', color: '#ffa500', up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', animal: 'tiger' },
        { id: 3, name: 'Elephant', color: '#00bfff', up: 'KeyI', down: 'KeyK', left: 'KeyJ', right: 'KeyL', animal: 'elephant' },
        { id: 4, name: 'Deer', color: '#32cd32', up: 'KeyT', down: 'KeyG', left: 'KeyF', right: 'KeyH', animal: 'deer' }
    ];

    /** --- CLASSES --- */
    class Player {
        constructor(config, startX, startY) {
            this.id = config.id;
            this.name = config.name;
            this.color = config.color;
            this.config = config;
            this.x = startX;
            this.y = startY;
            this.size = 25;
            this.speed = 6;
            this.score = 0;
            this.vx = 0;
            this.vy = 0;
            this.bounce = 0;
            this.facingLeft = false;
        }

        update() {
            // Movement
            let moving = false;
            if (keys[this.config.up]) { this.vy -= 1; moving = true; }
            if (keys[this.config.down]) { this.vy += 1; moving = true; }
            if (keys[this.config.left]) { this.vx -= 1; moving = true; this.facingLeft = true; }
            if (keys[this.config.right]) { this.vx += 1; moving = true; this.facingLeft = false; }

            // Friction & Speed Limit
            this.vx *= 0.85;
            this.vy *= 0.85;
            this.x += this.vx * this.speed;
            this.y += this.vy * this.speed;

            // Boundaries
            this.x = Math.max(this.size, Math.min(cw - this.size, this.x));
            this.y = Math.max(this.size, Math.min(ch - this.size, this.y));

            // Animation
            if (moving) {
                this.bounce = Math.sin(Date.now() * 0.015) * 5;
                if (Math.random() < 0.2) createParticles(this.x, this.y + this.size, 1, this.color, 'dust');
            } else {
                this.bounce = Math.sin(Date.now() * 0.005) * 2;
            }

            // HUD Update
            const scoreEl = document.getElementById(`p${this.id}-score`);
            if (scoreEl) scoreEl.innerText = this.score;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y - this.bounce);
            if (this.facingLeft) ctx.scale(-1, 1);

            // Glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;

            // Base Body
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();

            // Animal Specific Features
            ctx.fillStyle = '#fff';
            if (this.config.animal === 'bunny') {
                // Ears
                ctx.beginPath(); ctx.ellipse(-8, -25, 6, 18, -0.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(8, -25, 6, 18, 0.2, 0, Math.PI*2); ctx.fill();
            } else if (this.config.animal === 'tiger') {
                // Ears
                ctx.beginPath(); ctx.arc(-15, -15, 8, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(15, -15, 8, 0, Math.PI*2); ctx.fill();
                // Stripes
                ctx.fillStyle = '#000';
                ctx.fillRect(-10, -5, 20, 3);
                ctx.fillRect(-12, 2, 24, 3);
            } else if (this.config.animal === 'elephant') {
                // Ears
                ctx.beginPath(); ctx.ellipse(-20, -5, 12, 20, -0.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(20, -5, 12, 20, 0.2, 0, Math.PI*2); ctx.fill();
                // Trunk
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.roundRect(5, 5, 10, 25, 5); ctx.fill();
            } else if (this.config.animal === 'deer') {
                // Antlers
                ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(-10, -20); ctx.lineTo(-20, -40); ctx.moveTo(-15, -30); ctx.lineTo(-5, -35); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(10, -20); ctx.lineTo(20, -40); ctx.moveTo(15, -30); ctx.lineTo(5, -35); ctx.stroke();
            }

            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(8, -5, 4, 0, Math.PI*2); ctx.fill(); // Right eye
            ctx.beginPath(); ctx.arc(18, -5, 4, 0, Math.PI*2); ctx.fill(); // Left eye (looking forward)
            
            // White glint
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(9, -6, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(19, -6, 1.5, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }
    }

    class Collectible {
        constructor(x, y, type = 'star') {
            this.x = x;
            this.y = y;
            this.type = type; // star, fruit, butterfly
            this.size = type === 'fruit' ? 20 : (type === 'butterfly' ? 10 : 12);
            this.color = type === 'fruit' ? '#ff3366' : (type === 'butterfly' ? `hsl(${Math.random()*360}, 100%, 60%)` : '#ffd700');
            this.value = type === 'fruit' ? 5 : (type === 'butterfly' ? 3 : 1);
            this.life = type === 'star' ? 1000 : 500; // Frames to live
            this.vx = type === 'butterfly' ? (Math.random() - 0.5) * 4 : 0;
            this.vy = type === 'butterfly' ? (Math.random() - 0.5) * 4 : Math.sin(Date.now() * 0.01) * 2;
        }

        update() {
            this.life--;
            if (this.type === 'butterfly') {
                this.x += this.vx;
                this.y += this.vy;
                // Wander
                this.vx += (Math.random() - 0.5) * 0.5;
                this.vy += (Math.random() - 0.5) * 0.5;
                // Bounds
                if (this.x < 50 || this.x > cw - 50) this.vx *= -1;
                if (this.y < 50 || this.y > ch - 50) this.vy *= -1;
            } else {
                this.y += Math.sin(Date.now() * 0.005 + this.x) * 0.5;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.shadowBlur = 20;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;

            // Fade out when dying
            if (this.life < 100) ctx.globalAlpha = this.life / 100;

            if (this.type === 'star') {
                ctx.rotate(Date.now() * 0.002);
                drawStar(ctx, 0, 0, 5, this.size, this.size / 2);
            } else if (this.type === 'fruit') {
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI*2);
                ctx.fill();
                // Leaf
                ctx.fillStyle = '#32cd32';
                ctx.beginPath(); ctx.ellipse(5, -15, 4, 8, Math.PI/4, 0, Math.PI*2); ctx.fill();
            } else if (this.type === 'butterfly') {
                const flap = Math.sin(Date.now() * 0.02) * 0.8;
                ctx.scale(flap, 1);
                ctx.beginPath(); ctx.ellipse(-5, 0, 8, 12, -0.3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(5, 0, 8, 12, 0.3, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color, type = 'sparkle') {
            this.x = x;
            this.y = y;
            this.color = color;
            this.type = type;
            this.size = Math.random() * 4 + 2;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8;
            this.life = 1;
            this.decay = Math.random() * 0.02 + 0.02;
            if (type === 'dust') {
                this.vy = Math.random() * -2;
                this.color = 'rgba(255,255,255,0.5)';
            }
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
            if (this.type !== 'dust') this.vy += 0.1; // gravity
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.translate(this.x, this.y);
            if (this.type === 'sparkle') {
                drawStar(ctx, 0, 0, 4, this.size, this.size/2);
            } else {
                ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }
    }

    /** --- HELPERS --- */
    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;
            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fill();
    }

    function createParticles(x, y, count, color, type = 'sparkle') {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color, type));
        }
    }

    function spawnCollectible(type = 'star') {
        const padding = 100;
        const x = padding + Math.random() * (cw - padding * 2);
        const y = padding + Math.random() * (ch - padding * 2);
        entities.push(new Collectible(x, y, type));
    }

    function triggerEvent() {
        const events = ['Star Frenzy!', 'Butterfly Rain!', 'Giant Fruit Drop!'];
        activeEvent = events[Math.floor(Math.random() * events.length)];
        
        playSound('event');
        
        // Show Banner
        const banner = document.getElementById('event-banner');
        banner.innerText = activeEvent;
        banner.classList.add('show-banner');
        setTimeout(() => banner.classList.remove('show-banner'), 3000);

        // Execute Event
        if (activeEvent === 'Star Frenzy!') {
            for(let i=0; i<30; i++) setTimeout(() => spawnCollectible('star'), i * 100);
        } else if (activeEvent === 'Butterfly Rain!') {
            for(let i=0; i<20; i++) setTimeout(() => spawnCollectible('butterfly'), i * 150);
        } else if (activeEvent === 'Giant Fruit Drop!') {
            for(let i=0; i<5; i++) setTimeout(() => spawnCollectible('fruit'), i * 500);
        }
    }

    /** --- DRAWING BACKGROUND --- */
    function initBackground() {
        bgParticles = [];
        for (let i = 0; i < 50; i++) {
            bgParticles.push({
                x: Math.random() * cw,
                y: Math.random() * ch,
                s: Math.random() * 3 + 1,
                a: Math.random() * Math.PI * 2
            });
        }
    }

    function drawBackground() {
        // Floor Gradient
        const grad = ctx.createRadialGradient(cw/2, ch/2, 0, cw/2, ch/2, Math.max(cw, ch));
        grad.addColorStop(0, '#1a2a40');
        grad.addColorStop(1, '#050a10');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, cw, ch);

        // Sunrays
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.translate(cw/2, -100);
        ctx.rotate(Date.now() * 0.0002);
        for(let i=0; i<8; i++) {
            ctx.rotate((Math.PI * 2) / 8);
            const ray = ctx.createLinearGradient(0, 0, 0, ch*2);
            ray.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
            ray.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = ray;
            ctx.beginPath();
            ctx.moveTo(-100, 0);
            ctx.lineTo(cw*2, ch*2);
            ctx.lineTo(-cw*2, ch*2);
            ctx.fill();
        }
        ctx.restore();

        // Fireflies
        ctx.fillStyle = '#bfff00';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#bfff00';
        bgParticles.forEach(p => {
            p.y -= 0.5;
            p.x += Math.sin(p.a + Date.now()*0.001);
            if (p.y < 0) p.y = ch;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill();
        });
        ctx.shadowBlur = 0;
    }


    /** --- MAIN LOOP --- */
    function startGame(numPlayers) {
        initAudio();
        gameState = 'playing';
        players = [];
        entities = [];
        particles = [];
        gameTimer = 120;
        eventTimer = 20;
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');

        // Setup UI and Players
        const leftScores = document.getElementById('left-scores');
        const rightScores = document.getElementById('right-scores');
        leftScores.innerHTML = '';
        rightScores.innerHTML = '';

        const startPositions = [
            {x: cw*0.2, y: ch*0.2}, {x: cw*0.8, y: ch*0.2},
            {x: cw*0.2, y: ch*0.8}, {x: cw*0.8, y: ch*0.8}
        ];

        for (let i = 0; i < numPlayers; i++) {
            const conf = PLAYER_CONFIGS[i];
            players.push(new Player(conf, startPositions[i].x, startPositions[i].y));
            
            const scoreHtml = `
                <div class="player-score" style="border-color: ${conf.color}; color: ${conf.color}">
                    ${conf.name}: <span id="p${conf.id}-score">0</span>
                </div>`;
            if (i % 2 === 0) leftScores.innerHTML += scoreHtml;
            else rightScores.innerHTML += scoreHtml;
        }

        initBackground();
        
        // Initial Stars
        for(let i=0; i<15; i++) spawnCollectible();

        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function gameLoop(timestamp) {
        if (gameState !== 'playing') return;

        const deltaTime = (timestamp - lastTime) / 1000;
        lastTime = timestamp;

        ctx.clearRect(0, 0, cw, ch);
        drawBackground();

        // Spawn routine stars
        if (Math.random() < 0.05 && entities.length < 30) spawnCollectible();

        // Update Timers
        gameTimer -= deltaTime;
        eventTimer -= deltaTime;
        
        document.getElementById('time-left').innerText = 
            Math.floor(gameTimer / 60) + ':' + (Math.floor(gameTimer % 60).toString().padStart(2, '0'));

        if (eventTimer <= 0 && gameTimer > 5) {
            triggerEvent();
            eventTimer = 20;
        }

        if (gameTimer <= 0) {
            endGame();
            return;
        }

        // Entities (Collectibles)
        for (let i = entities.length - 1; i >= 0; i--) {
            let ent = entities[i];
            ent.update();
            ent.draw();

            // Collision with players
            for (let p of players) {
                const dist = Math.hypot(p.x - ent.x, p.y - ent.y);
                if (dist < p.size + ent.size) {
                    p.score += ent.value;
                    createParticles(ent.x, ent.y, 15, ent.color);
                    playSound('collect');
                    entities.splice(i, 1);
                    break;
                }
            }
            if (ent && ent.life <= 0) entities.splice(i, 1);
        }

        // Players
        players.forEach(p => {
            p.update();
            p.draw();
        });

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        gameState = 'gameover';
        playSound('win');
        
        document.getElementById('hud').classList.add('hidden');
        const goScreen = document.getElementById('game-over-screen');
        goScreen.classList.remove('hidden');

        // Determine Winner
        players.sort((a, b) => b.score - a.score);
        const winner = players[0];
        
        const winText = document.getElementById('winner-text');
        winText.innerText = `${winner.name} Wins!`;
        winText.style.color = winner.color;

        const finalScores = document.getElementById('final-scores');
        finalScores.innerHTML = players.map((p, i) => 
            `<div style="color: ${p.color}; margin: 5px 0;">#${i+1} ${p.name}: ${p.score} pts</div>`
        ).join('');

        // Fireworks background
        ctx.clearRect(0,0,cw,ch);
        drawBackground();
        for(let i=0; i<100; i++) createParticles(cw/2, ch/2, 1, `hsl(${Math.random()*360}, 100%, 60%)`);
        
        function fireworksLoop() {
            if(gameState !== 'gameover') return;
            ctx.fillStyle = 'rgba(13, 27, 42, 0.2)';
            ctx.fillRect(0, 0, cw, ch);
            if(Math.random() < 0.1) {
                createParticles(Math.random()*cw, Math.random()*(ch/2), 30, `hsl(${Math.random()*360}, 100%, 60%)`);
                playSound('collect');
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(fireworksLoop);
        }
        fireworksLoop();
    }

    function resetToMenu() {
        gameState = 'menu';
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        ctx.clearRect(0,0,cw,ch);
        initBackground();
        drawBackground();
    }

    // Initial draw
    initBackground();
    drawBackground();

</script>
</body>
</html>
