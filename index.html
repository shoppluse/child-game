<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE 9TH FLOOR</title>
    <style>
        /* --- GLOBAL VARIABLES & FONTS --- */
        :root {
            --bg-base: #050505;
            --text-main: #d4d4d4;
            --text-dim: #6b6b6b;
            --text-highlight: #c7a052; /* Faded gold */
            --text-glitch: #ff3333;
            --ui-border: rgba(199, 160, 82, 0.3);
            --crt-scanline: rgba(255, 255, 255, 0.02);
            --font-main: 'Courier New', Courier, monospace;
            --font-title: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ATMOSPHERIC EFFECTS (CRT, GRAIN, GLITCH) --- */
        #fx-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 100;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000000 120%);
            z-index: 99;
            pointer-events: none;
        }

        .glitch-anim {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            color: var(--text-glitch);
            text-shadow: 2px 0 blue, -2px 0 red;
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-10deg); }
            40% { transform: skew(10deg); }
            60% { transform: skew(-5deg); }
            80% { transform: skew(5deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes flicker {
            0% { opacity: 1; }
            5% { opacity: 0.8; }
            10% { opacity: 1; }
            15% { opacity: 0.4; }
            20% { opacity: 1; }
            50% { opacity: 1; }
            55% { opacity: 0.9; }
            60% { opacity: 1; }
        }

        /* --- UI LAYOUT --- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
            padding: 40px;
        }

        .hidden { display: none !important; }

        /* Main Menu */
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 5, 0.95);
            z-index: 200;
        }

        #main-menu h1 {
            font-family: var(--font-title);
            font-size: 4rem;
            letter-spacing: 15px;
            margin-bottom: 5px;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            animation: flicker 4s infinite;
        }

        #main-menu h3 {
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--text-dim);
            margin-bottom: 50px;
        }

        .btn {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid transparent;
            padding: 10px 20px;
            font-family: var(--font-main);
            font-size: 1.2rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            margin: 5px 0;
            width: 300px;
            text-align: center;
        }

        .btn:hover {
            color: var(--text-highlight);
            border: 1px solid var(--ui-border);
            background: rgba(199, 160, 82, 0.05);
            letter-spacing: 5px;
        }

        /* Game HUD */
        header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--ui-border);
            padding-bottom: 15px;
            margin-bottom: 30px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--text-dim);
        }

        .hud-distortion { color: var(--text-glitch); }

        /* Main Story View */
        #story-view {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-right: 15px;
        }

        #story-text {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 40px;
            min-height: 200px;
            white-space: pre-wrap;
            text-shadow: 0 0 5px rgba(255,255,255,0.1);
        }

        #choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            margin-bottom: 20px;
        }

        .choice-btn {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--ui-border);
            color: var(--text-main);
            padding: 15px 20px;
            text-align: left;
            font-family: var(--font-main);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .choice-btn:hover {
            background: var(--text-main);
            color: var(--bg-base);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        /* Modals (Evidence, Inventory) */
        .modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 80%;
            background: rgba(10, 10, 12, 0.98);
            border: 1px solid var(--ui-border);
            z-index: 150;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        .modal h2 { margin-bottom: 20px; color: var(--text-highlight); letter-spacing: 2px;}
        .modal-content { flex-grow: 1; overflow-y: auto; }
        .modal-close { margin-top: 20px; align-self: flex-end; }
        
        .evidence-item {
            border-bottom: 1px solid #333;
            padding: 15px 0;
        }
        .evidence-title { color: var(--text-highlight); font-weight: bold; margin-bottom: 5px;}

        /* Footer Nav */
        footer {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--ui-border);
            padding-top: 15px;
        }
        .nav-btn {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; letter-spacing: 2px; font-size: 0.9rem;
        }
        .nav-btn:hover { color: var(--text-highlight); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--text-dim); }

    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>
    <div class="vignette"></div>
    <div class="crt-overlay"></div>

    <div id="main-menu">
        <h1>THE 9TH FLOOR</h1>
        <h3>ASHCROFT HEIGHTS</h3>
        <button class="btn" onclick="startGame()">Enter Building</button>
        <button class="btn" onclick="loadGame()" id="continue-btn">Continue Investigation</button>
        <div style="margin-top: 50px; font-size: 0.7rem; color: #444; letter-spacing: 1px;">WARNING: REALITY INSTABILITY DETECTED</div>
    </div>

    <div id="game-container" class="hidden">
        <header>
            <div id="hud-location">APT 402</div>
            <div id="hud-time">03:15 AM</div>
            <div id="hud-status">STABLE</div>
        </header>

        <div id="story-view">
            <div id="story-text"></div>
            <div id="choices-container"></div>
        </div>

        <footer>
            <button class="nav-btn" onclick="openModal('evidence')">[ EVIDENCE BOARD ]</button>
            <button class="nav-btn" onclick="openModal('inventory')">[ INVENTORY ]</button>
            <button class="nav-btn" onclick="saveGame()">[ SAVE RECORD ]</button>
        </footer>
    </div>

    <div id="evidence-modal" class="modal hidden">
        <h2>EVIDENCE BOARD</h2>
        <div class="modal-content" id="evidence-list">No evidence collected.</div>
        <button class="btn modal-close" onclick="closeModals()">Close</button>
    </div>

    <div id="inventory-modal" class="modal hidden">
        <h2>INVENTORY & MEMORIES</h2>
        <div class="modal-content" id="inventory-list">Pockets are empty.</div>
        <button class="btn modal-close" onclick="closeModals()">Close</button>
    </div>

<script>
    /* ==========================================
       AUDIO ENGINE (Web Audio API)
       Procedural Soundscapes. No External Files.
       ========================================== */
    let audioCtx;
    let masterGain, droneOsc, droneFilter;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.5;
        masterGain.connect(audioCtx.destination);

        // Ambient Low Drone (The Hum of the building)
        droneOsc = audioCtx.createOscillator();
        droneOsc.type = 'sawtooth';
        droneOsc.frequency.value = 40; 
        
        droneFilter = audioCtx.createBiquadFilter();
        droneFilter.type = 'lowpass';
        droneFilter.frequency.value = 100;

        const lfo = audioCtx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.1;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 50;

        lfo.connect(lfoGain).connect(droneFilter.frequency);
        droneOsc.connect(droneFilter).connect(masterGain);
        
        droneOsc.start();
        lfo.start();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain).connect(masterGain);

        if (type === 'click') {
            // UI Click
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'glitch') {
            // Unsettling Glitch/Static
            osc.type = 'square';
            osc.frequency.setValueAtTime(150 + Math.random()*200, now);
            osc.frequency.setValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'elevator') {
            // Heavy metallic clank
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        }
    }

    function updateAudioDistortion(level) {
        if (!audioCtx) return;
        // As distortion rises, drone gets higher and more erratic
        droneFilter.frequency.rampTo(100 + (level * 20), 2);
    }

    /* ==========================================
       VISUAL FX ENGINE (Canvas)
       ========================================== */
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initParticles() {
        particles = [];
        for (let i = 0; i < 150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speedY: Math.random() * 0.5 + 0.1,
                speedX: (Math.random() - 0.5) * 0.5,
                opacity: Math.random() * 0.5
            });
        }
    }

    function animateFX() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Base atmospheric dust
        let dist = gameState.distortion || 0;
        let color = dist > 70 ? 'rgba(255, 50, 50,' : 'rgba(200, 200, 220,';

        particles.forEach(p => {
            p.y -= p.speedY;
            p.x += p.speedX;
            if (p.y < 0) p.y = canvas.height;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;

            ctx.fillStyle = `${color} ${p.opacity})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size + (dist > 80 ? 1 : 0), 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(animateFX);
    }
    initParticles();
    animateFX();

    /* ==========================================
       GAME STATE & LOGIC
       ========================================== */
    let gameState = {
        node: 'intro',
        time: '03:15 AM',
        location: 'APT 402',
        distortion: 0,
        inventory: [],
        evidence: [],
        flags: {
            knows_loop: false,
            trust_management: 0,
            trust_self: 0,
            loop_iteration: localStorage.getItem('ashcroft_loops') ? parseInt(localStorage.getItem('ashcroft_loops')) : 1
        }
    };

    let typingTimer;

    function startGame() {
        initAudio();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('game-container').classList.remove('hidden');
        
        // Meta-narrative trick: If they've played before, it's a loop.
        if (gameState.flags.loop_iteration > 1) {
            gameState.node = 'intro_loop';
        }
        
        renderNode(gameState.node);
    }

    function loadGame() {
        const saved = localStorage.getItem('ashcroft_save');
        if (saved) {
            gameState = JSON.parse(saved);
            startGame();
        } else {
            alert("No saved record found.");
        }
    }

    function saveGame() {
        localStorage.setItem('ashcroft_save', JSON.stringify(gameState));
        playSound('click');
        
        const btn = document.querySelector('footer button:nth-child(3)');
        btn.innerText = "[ RECORD SAVED ]";
        setTimeout(() => btn.innerText = "[ SAVE RECORD ]", 2000);
    }

    function addEvidence(id, title, desc) {
        if (!gameState.evidence.find(e => e.id === id)) {
            gameState.evidence.push({ id, title, desc });
            gameState.distortion += 10;
            playSound('glitch');
            updateHUD();
        }
    }

    function addInventory(item) {
        if (!gameState.inventory.includes(item)) {
            gameState.inventory.push(item);
        }
    }

    function openModal(type) {
        playSound('click');
        document.getElementById('evidence-modal').classList.add('hidden');
        document.getElementById('inventory-modal').classList.add('hidden');
        
        if (type === 'evidence') {
            const list = document.getElementById('evidence-list');
            if (gameState.evidence.length === 0) list.innerHTML = "No evidence collected. Reality remains undocumented.";
            else {
                list.innerHTML = gameState.evidence.map(e => `
                    <div class="evidence-item">
                        <div class="evidence-title">${e.title}</div>
                        <div>${e.desc}</div>
                    </div>
                `).join('');
            }
            document.getElementById('evidence-modal').classList.remove('hidden');
        } else {
            const list = document.getElementById('inventory-list');
            if (gameState.inventory.length === 0) list.innerHTML = "You carry nothing.";
            else {
                list.innerHTML = gameState.inventory.map(i => `
                    <div class="evidence-item">> ${i}</div>
                `).join('');
            }
            document.getElementById('inventory-modal').classList.remove('hidden');
        }
    }

    function closeModals() {
        playSound('click');
        document.getElementById('evidence-modal').classList.add('hidden');
        document.getElementById('inventory-modal').classList.add('hidden');
    }

    function updateHUD() {
        document.getElementById('hud-location').innerText = gameState.location;
        document.getElementById('hud-time').innerText = gameState.time;
        
        const statusEl = document.getElementById('hud-status');
        if (gameState.distortion < 20) { statusEl.innerText = "STABLE"; statusEl.className = ""; }
        else if (gameState.distortion < 60) { statusEl.innerText = "SHIFTING"; statusEl.className = ""; }
        else if (gameState.distortion < 90) { statusEl.innerText = "UNSTABLE"; statusEl.className = "hud-distortion"; }
        else { statusEl.innerText = "REALITY FAILURE"; statusEl.className = "glitch-anim"; }

        updateAudioDistortion(gameState.distortion);
    }

    /* ==========================================
       NARRATIVE DATA (The Script)
       ========================================== */
    const storyData = {
        "intro": {
            loc: "APT 402", time: "03:15 AM",
            text: "You can't sleep. The hum of the building's wiring feels louder tonight. It vibrates in your teeth.\n\nYou moved into Ashcroft Heights three weeks ago. It's a cheap, concrete brutalist block. Eight floors. \n\nBut something is wrong. The hallway clock just stopped.",
            choices: [
                { text: "Look out the window", next: "intro_window" },
                { text: "Leave the apartment", next: "hallway_f4" }
            ]
        },
        "intro_loop": {
            loc: "APT 402", time: "03:15 AM",
            text: "You wake up gasping. \n\nThe hum of the building is deafening. You moved in... when did you move in? Three weeks ago? Or was it longer? \n\nThe hallway clock stopped. Just like it did before. A severe sense of Deja Vu washes over you.",
            onEnter: () => { gameState.distortion += 20; },
            choices: [
                { text: "Leave the apartment", next: "hallway_f4" }
            ]
        },
        "intro_window": {
            loc: "APT 402", time: "03:16 AM",
            text: "You look down at the street. It's empty. No cars, no streetlights. Just a dense, impenetrable gray fog swallowing the ground floor. It looks like the building is floating in a void.",
            choices: [
                { text: "Go to the hallway", next: "hallway_f4" }
            ]
        },
        "hallway_f4": {
            loc: "4TH FLOOR HALLWAY", time: "03:16 AM",
            text: "The fluorescent lights flicker. The hallway seems longer than it did yesterday. The doors stretch down into the gloom. \n\nAt the end of the hall, the elevator doors are open. The interior light is amber. Waiting.",
            choices: [
                { text: "Approach the elevator", next: "elevator_first" },
                { text: "Knock on your neighbor's door (403)", next: "neighbor_403" }
            ]
        },
        "neighbor_403": {
            loc: "4TH FLOOR HALLWAY", time: "03:16 AM",
            text: "You knock on Mrs. Gable's door. No answer. \n\nYou try the knob. It's locked. But you notice something strange. The nameplate doesn't say GABLE anymore. It's blank. The metal is smooth, as if a name was never engraved there.",
            onEnter: () => { 
                addEvidence('blank_plate', 'Blank Nameplate', 'Mrs. Gable\'s nameplate on apt 403 has vanished completely.');
            },
            choices: [
                { text: "Go to the elevator", next: "elevator_first" }
            ]
        },
        "elevator_first": {
            loc: "ELEVATOR", time: "03:17 AM",
            text: "You step inside the cramped, wood-paneled elevator. The control panel has buttons 1 through 8. \n\nSuddenly, the panel sparks. A heavy mechanical grinding echoes from the shaft. The panel shifts, and a new button slides into place at the top.\n\n[ 9 ]",
            onEnter: () => { playSound('elevator'); },
            choices: [
                { text: "Press 9", next: "floor_9_early" },
                { text: "Press 1 (Lobby)", next: "lobby" },
                { text: "Press B (Basement Archives)", next: "basement" }
            ]
        },
        "floor_9_early": {
            loc: "ELEVATOR", time: "03:17 AM",
            text: "You press 9. \n\nThe button is cold. The elevator shudders, begins to rise... then halts violently. The lights go out. \n\nA voice comes over the intercom, synthesized and flat: \n\n'AUTHORIZATION DENIED. RESIDENT CYCLE INCOMPLETE.' \n\nThe elevator drops back down to the lobby.",
            onEnter: () => { playSound('glitch'); gameState.distortion += 10; },
            choices: [
                { text: "Exit to Lobby", next: "lobby" }
            ]
        },
        "lobby": {
            loc: "LOBBY", time: "04:02 AM",
            text: "The lobby is deserted. The front doors are chained shut from the inside with heavy padlocks. Through the glass, you only see the swirling gray fog.\n\nBehind the concierge desk is the Security Room door.",
            choices: [
                { text: "Check Security Room", next: "security_room" },
                { text: "Go down to Basement", next: "basement" },
                { text: "Return to Elevator", next: "elevator_hub" }
            ]
        },
        "security_room": {
            loc: "SECURITY", time: "04:15 AM",
            text: "Banks of CRT monitors glow in the dark room. Most show static. \n\nOne monitor shows the 4th-floor hallway. You see a figure standing outside your door (402). The timestamp says it's happening right now. \n\nAnother monitor shows... the 9th floor?",
            choices: [
                { text: "Examine 4th Floor monitor", next: "sec_monitor_4" },
                { text: "Examine 9th Floor monitor", next: "sec_monitor_9" },
                { text: "Search the desk files", next: "sec_files" },
                { text: "Leave", next: "lobby" }
            ]
        },
        "sec_monitor_4": {
            loc: "SECURITY", time: "04:16 AM",
            text: "You look closely at the figure outside your door. \n\nIt's you. \n\nYou are watching yourself on the screen. But you are down here. The 'you' on the screen slowly turns and looks directly into the camera. The camera feed cuts to black.",
            onEnter: () => { 
                playSound('glitch'); 
                addEvidence('camera_self', 'The Doppelganger', 'Saw myself on the 4th floor camera while I was in the lobby.');
            },
            choices: [
                { text: "Back away from the monitors", next: "security_room" }
            ]
        },
        "sec_monitor_9": {
            loc: "SECURITY", time: "04:18 AM",
            text: "The 9th floor feed is heavily corrupted. You can barely make out a long hallway, identical to the others, but the walls are lined with server racks and medical equipment instead of apartment doors. \n\nA massive vault door sits at the end.",
            onEnter: () => { 
                addEvidence('floor9_visual', 'Floor 9 Feed', 'Floor 9 exists. It looks like a laboratory or containment facility.');
            },
            choices: [
                { text: "Back away", next: "security_room" }
            ]
        },
        "sec_files": {
            loc: "SECURITY", time: "04:20 AM",
            text: "You rifle through the security logs. You find a 'Purge Schedule'. \n\nIt lists apartment numbers and dates. \n'Apt 403 (Gable) - Cycle End'\n'Apt 201 (Davis) - Cycle End'\n\nAt the bottom of the page, written in fresh red ink:\n'Apt 402 (You) - Tonight.'",
            onEnter: () => {
                gameState.flags.trust_management -= 10;
                addEvidence('purge_list', 'The Purge Schedule', 'Management is erasing tenants. I am scheduled for tonight.');
            },
            choices: [
                { text: "Take the Override Keycard from the desk", next: "take_keycard" },
                { text: "Leave", next: "lobby" }
            ]
        },
        "take_keycard": {
            loc: "SECURITY", time: "04:22 AM",
            text: "You pocket the yellow Management Override Keycard. This should give you access to the elevator's restricted systems.",
            onEnter: () => { addInventory('Override Keycard'); },
            choices: [
                { text: "Leave Security", next: "lobby" }
            ]
        },

    function incrementLoops() {
        let loops = localStorage.getItem('ashcroft_loops');
        loops = loops ? parseInt(loops) + 1 : 2;
        localStorage.setItem('ashcroft_loops', loops);
        gameState.flags.loop_iteration = loops;
    }

    /* ==========================================
       RENDER ENGINE
       ========================================== */
    function renderNode(nodeId) {
        const node = storyData[nodeId];
        if (!node) return;

        gameState.node = nodeId;
        gameState.location = node.loc;
        gameState.time = node.time;

        if (node.onEnter) node.onEnter();
        updateHUD();

        const storyTextEl = document.getElementById('story-text');
        const choicesEl = document.getElementById('choices-container');
        
        // Clear previous
        storyTextEl.innerHTML = '';
        choicesEl.innerHTML = '';
        clearTimeout(typingTimer);

        // Apply Glitch FX to text if distortion is high
        if (gameState.distortion > 70) {
            storyTextEl.classList.add('glitch-anim');
        } else {
            storyTextEl.classList.remove('glitch-anim');
        }

        // Cinematic Typing Effect
        let i = 0;
        let textToType = node.text;
        
        function typeWriter() {
            if (i < textToType.length) {
                // If it's a line break, add it properly
                if (textToType.charAt(i) === '\n') {
                    storyTextEl.innerHTML += '<br>';
                } else {
                    storyTextEl.innerHTML += textToType.charAt(i);
                }
                
                // Randomize typing speed slightly, add audio blip occasionally
                if (i % 4 === 0) playSound('click');
                
                i++;
                let speed = gameState.distortion > 50 ? (Math.random() * 20 + 10) : 30; // Faster/erratic if distorted
                typingTimer = setTimeout(typeWriter, speed);
            } else {
                renderChoices(node.choices);
            }
        }
        typeWriter();
    }

    function renderChoices(choices) {
        const choicesEl = document.getElementById('choices-container');
        choices.forEach(choice => {
            // Check conditions
            if (choice.condition && !choice.condition()) return;

            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerHTML = `<span>> ${choice.text}</span>`;
            
            btn.onclick = () => {
                playSound('click');
                renderNode(choice.next);
            };
            choicesEl.appendChild(btn);
        });
    }
