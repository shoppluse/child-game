<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForge Studio v3 - Unified</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<style>
/* ── BASE STYLES REMAIN UNCHANGED ── */
:root {
  --bg: #0a0b0f;
  --bg2: #0f1117;
  --bg3: #161821;
  --bg4: #1e2130;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --accent: #5b6af0;
  --accent2: #a78bfa;
  --accent-glow: rgba(91,106,240,0.3);
  --green: #34d399;
  --red: #f87171;
  --yellow: #fbbf24;
  --txt: #eef0f8;
  --txt2: #8892a4;
  --txt3: #4a5568;
  --sidebar-w: 52px;
  --drawer-w: 240px;
  --header-h: 44px;
  --tab-h: 34px;
  --radius: 8px;
  --trans: 0.18s ease;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;display:flex;}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;}
input,select,textarea{font-family:inherit;outline:none;color:var(--txt);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── UI COMPONENTS (SIDEBAR, DRAWER, PANELS) ── */
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:20;flex-shrink:0;}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin-bottom:8px;box-shadow:0 0 20px var(--accent-glow);flex-shrink:0;}
.logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;}
.sb-btn{width:38px;height:38px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--txt3);transition:all var(--trans);position:relative;}
.sb-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;}
.sb-btn:hover{color:var(--txt);background:var(--bg4);}
.sb-btn.on{color:var(--accent);background:var(--bg4);}
.sb-btn[data-tip]::after{content:attr(data-tip);position:absolute;left:calc(var(--sidebar-w) + 4px);background:#1e2130;color:var(--txt);padding:4px 8px;border-radius:5px;font-size:0.72rem;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:100;border:1px solid var(--border2);}
.sb-btn:hover[data-tip]::after{opacity:1;}
.sb-sep{width:30px;height:1px;background:var(--border);margin:4px 0;}
.drawer{width:var(--drawer-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width var(--trans);flex-shrink:0;}
.drawer.closed{width:0;border:none;}
.dh{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;}
.dh-title{font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);}
.dc{flex:1;padding:12px;overflow-y:auto;}
.d-section{display:none;flex-direction:column;height:100%;}
.d-section.active{display:flex;}
.proj-list{display:flex;flex-direction:column;gap:6px;}
.proj-item{padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);cursor:pointer;transition:all var(--trans);}
.proj-item:hover,.proj-item.on{border-color:var(--accent);}
.proj-item.on{background:var(--bg4);}
.proj-name{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proj-date{font-size:0.68rem;color:var(--txt3);margin-top:2px;}
.proj-actions{display:flex;gap:4px;margin-top:6px;}
.proj-btn{font-size:0.68rem;padding:2px 7px;border-radius:4px;border:1px solid var(--border2);color:var(--txt2);transition:all var(--trans);}
.proj-btn:hover{color:var(--txt);border-color:var(--txt2);}
.proj-btn.del:hover{color:var(--red);border-color:var(--red);}
.tpl-card{padding:10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);cursor:pointer;transition:all var(--trans);margin-bottom:6px;}
.tpl-card:hover{border-color:var(--accent);}
.tpl-name{font-size:0.82rem;font-weight:700;margin-bottom:2px;}
.tpl-desc{font-size:0.7rem;color:var(--txt2);line-height:1.4;}
.tpl-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.tpl-tag{font-size:0.62rem;padding:1px 5px;border-radius:3px;background:var(--bg4);color:var(--txt3);}
.cdn-item-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);margin-bottom:5px;}
.cdn-badge{font-size:0.6rem;font-weight:700;padding:1px 5px;border-radius:3px;flex-shrink:0;}
.cdn-badge.js{background:rgba(251,191,36,0.15);color:#fbbf24;}
.cdn-badge.css{background:rgba(96,165,250,0.15);color:#60a5fa;}
.cdn-url{font-size:0.68rem;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:'JetBrains Mono',monospace;}
.cdn-rm{color:var(--txt3);transition:color var(--trans);}
.cdn-rm:hover{color:var(--red);}
.cdn-add-row{display:flex;gap:6px;margin:8px 0;}
.cdn-input{flex:1;padding:6px 8px;font-size:0.75rem;background:var(--bg3);border:1px solid var(--border);border-radius:6px;font-family:'JetBrains Mono',monospace;}
.cdn-input:focus{border-color:var(--accent);}
.small-btn{padding:5px 10px;font-size:0.73rem;font-weight:600;border-radius:6px;border:1px solid var(--border2);color:var(--txt2);transition:all var(--trans);}
.small-btn:hover{color:var(--txt);border-color:var(--accent);}
.preset-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.preset-chip{font-size:0.68rem;padding:3px 8px;border-radius:12px;border:1px solid var(--border);color:var(--txt2);transition:all var(--trans);}
.preset-chip:hover{border-color:var(--accent);color:var(--txt);}
.preset-chip.added{border-color:var(--green);color:var(--green);}
.snap-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);margin-bottom:5px;}
.snap-meta{font-size:0.72rem;font-weight:600;}
.snap-time{font-size:0.65rem;color:var(--txt3);margin-top:1px;}
.snap-restore{font-size:0.7rem;color:var(--accent);font-weight:600;}

/* ── WORKSPACE ── */
.workspace{display:flex;flex:1;overflow:hidden;position:relative;}

/* ── EDITOR PANE (Removed Tab Bar CSS, Simplified) ── */
.editor-pane{display:flex;flex-direction:column;background:var(--bg2);overflow:hidden;width:50%;min-width:200px;}
.pane-header{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;gap:8px;}
.editor-wrap{flex:1;overflow:hidden;position:relative;}

/* ── CONSOLE ── */
.console-panel{height:140px;border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:height var(--trans);}
.console-panel.closed{height:30px;}
.console-hdr{height:30px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer;flex-shrink:0;}
.console-title{font-size:0.7rem;font-weight:700;color:var(--txt2);display:flex;align-items:center;gap:6px;}
.console-body{flex:1;overflow-y:auto;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:0.75rem;}
.log-line{padding:2px 6px;border-radius:3px;margin-bottom:3px;line-height:1.5;border-left:2px solid transparent;word-break:break-all;}
.log-line.log{border-left-color:var(--txt3);}
.log-line.warn{color:#fef08a;border-left-color:var(--yellow);}
.log-line.error{color:#fca5a5;border-left-color:var(--red);}

/* ── RESIZER ── */
.resizer{width:5px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border);cursor:col-resize;flex-shrink:0;transition:background var(--trans);}
.resizer:hover,.resizer.drag{background:var(--accent);}

/* ── PREVIEW PANE ── */
.preview-pane{display:flex;flex-direction:column;flex:1;background:var(--bg);overflow:hidden;}
.preview-header{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;gap:8px;}
.preview-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:var(--bg);}
.preview-frame{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,0.6);overflow:hidden;width:100%;height:100%;transition:width 0.3s,height 0.3s;position:relative;}
.preview-frame.mob{width:375px;height:667px;}
.preview-frame.tab{width:768px;height:1024px;}
.preview-frame.lap{width:1024px;height:768px;}
.sandbox{width:100%;height:100%;border:none;}

/* Design mode overlay border */
.preview-frame.design-on{outline:3px solid var(--accent);}

/* ── BUTTONS ── */
.btn{height:28px;padding:0 10px;border-radius:6px;font-size:0.75rem;font-weight:600;display:flex;align-items:center;gap:5px;transition:all var(--trans);border:1px solid var(--border2);color:var(--txt2);}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.btn:hover{color:var(--txt);border-color:var(--txt2);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px var(--accent-glow);}
.btn.primary:hover{background:#4a58dc;}
.btn.active-state{background:var(--bg4);color:var(--accent);border-color:var(--accent);}

/* ── PROPS PANEL ── */
.props-panel{width:220px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width var(--trans);}
.props-panel.closed{width:0;border:none;}
.props-hdr{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;flex-shrink:0;}
.props-title{font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);}
.props-body{flex:1;padding:12px;overflow-y:auto;}
.prop-group{margin-bottom:16px;}
.prop-label{font-size:0.65rem;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
.prop-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.prop-name{font-size:0.72rem;color:var(--txt2);}
.prop-input{font-size:0.72rem;padding:3px 6px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);width:110px;font-family:'JetBrains Mono',monospace;}
.prop-input:focus{border-color:var(--accent);}
.prop-color{width:30px;height:24px;padding:0;border-radius:4px;border:1px solid var(--border);cursor:pointer;}
.no-selection{text-align:center;padding:24px 12px;color:var(--txt3);font-size:0.78rem;line-height:1.5;}
.tag-chip{display:inline-block;font-size:0.7rem;padding:2px 8px;border-radius:12px;background:var(--bg4);border:1px solid var(--border2);color:var(--txt2);margin-bottom:8px;font-family:'JetBrains Mono',monospace;}
.add-child-btn{width:100%;padding:5px;font-size:0.72rem;border-radius:5px;border:1px dashed var(--border2);color:var(--txt3);transition:all var(--trans);margin-top:4px;}
.add-child-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── MODALS & MISC ── */
.cp-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);z-index:900;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;opacity:0;transition:opacity 0.2s;}
.cp-overlay.open{display:flex;opacity:1;}
.cp-box{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;width:90%;max-width:560px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.7);transform:translateY(-10px);transition:transform 0.2s;}
.cp-overlay.open .cp-box{transform:none;}
.cp-search{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.cp-search svg{width:16px;height:16px;stroke:var(--txt3);fill:none;stroke-width:2;flex-shrink:0;}
.cp-input{flex:1;background:none;border:none;font-size:0.9rem;color:var(--txt);}
.cp-input::placeholder{color:var(--txt3);}
.cp-results{max-height:320px;overflow-y:auto;padding:6px;}
.cp-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background 0.1s;}
.cp-item:hover,.cp-item.sel{background:var(--bg4);}
.cp-icon{width:28px;height:28px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cp-icon svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2;}
.cp-text .cp-label{font-size:0.82rem;font-weight:600;}
.cp-text .cp-desc{font-size:0.68rem;color:var(--txt3);margin-top:1px;}
.cp-kbd{margin-left:auto;font-size:0.65rem;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--border2);color:var(--txt3);font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.cp-footer{border-top:1px solid var(--border);padding:6px 16px;display:flex;gap:12px;}
.cp-hint{font-size:0.65rem;color:var(--txt3);display:flex;align-items:center;gap:4px;}
.cp-hint kbd{padding:1px 4px;border-radius:3px;background:var(--bg);border:1px solid var(--border2);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:800;display:none;align-items:center;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:24px;width:90%;max-width:420px;}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:8px;}
.modal-desc{font-size:0.8rem;color:var(--txt2);margin-bottom:16px;}
.modal-input{width:100%;padding:8px 12px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;font-size:0.85rem;margin-bottom:16px;}
.modal-input:focus{border-color:var(--accent);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}
.label-txt{font-size:0.65rem;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:0.8px;}
select.styled{padding:4px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;font-size:0.75rem;color:var(--txt);}
select.styled:focus{border-color:var(--accent);}
.check-label{display:flex;align-items:center;gap:5px;font-size:0.73rem;color:var(--txt2);cursor:pointer;}
.check-label input{accent-color:var(--accent);}
.empty-state{text-align:center;padding:20px;color:var(--txt3);font-size:0.75rem;}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
  </div>
  <button class="sb-btn on" data-drawer="projects" data-tip="Projects"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></button>
  <button class="sb-btn" data-drawer="templates" data-tip="Templates"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button>
  <button class="sb-btn" data-drawer="history" data-tip="Snapshots"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
  <button class="sb-btn" data-drawer="export" data-tip="Export"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
  <div class="sb-sep"></div>
  <button class="sb-btn" id="btnTheme" data-tip="Toggle Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
  <button class="sb-btn" id="btnCP" data-tip="Command Palette (Ctrl+Shift+P)"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>
</aside>

<div class="drawer" id="drawer">
  <div class="d-section active" id="dsec-projects">
    <div class="dh">
      <span class="dh-title">Projects</span>
      <button class="sb-btn" id="btnNewProj" style="width:28px;height:28px;" data-tip="New"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div class="dc"><div class="proj-list" id="projList"></div></div>
  </div>
  <div class="d-section" id="dsec-templates">
    <div class="dh"><span class="dh-title">Templates</span></div>
    <div class="dc" id="tplGrid"></div>
  </div>
  <div class="d-section" id="dsec-history">
    <div class="dh">
      <span class="dh-title">Snapshots</span>
      <button class="sb-btn" id="btnNewSnap" style="width:28px;height:28px;" data-tip="Save now"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
    </div>
    <div class="dc" id="snapList"></div>
  </div>
  <div class="d-section" id="dsec-export">
    <div class="dh"><span class="dh-title">Export</span></div>
    <div class="dc" style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" id="btnExportHTML" style="width:100%;justify-content:center;">Export Single HTML</button>
      <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px;">
        <div class="label-txt" style="margin-bottom:6px;">Import Document</div>
        <input type="file" id="importFile" accept=".html" style="display:none;">
        <button class="btn" id="btnImport" style="width:100%;justify-content:center;">Import HTML</button>
      </div>
    </div>
  </div>
</div>

<div class="workspace" id="ws">
  <div class="editor-pane" id="edPane">
    <div class="pane-header">
      <div style="display:flex;gap:8px;align-items:center;">
        <label class="check-label"><input type="checkbox" id="chkAutoRun" checked>Auto Run</label>
        <label class="check-label"><input type="checkbox" id="chkAutoSave" checked>Auto Save</label>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button class="btn" id="btnFmt">Format</button>
        <button class="btn primary" id="btnRun"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Run</button>
      </div>
    </div>
    <div class="editor-wrap" id="monacoMount"></div>
    <div class="console-panel closed" id="consolePanel">
      <div class="console-hdr" id="consoleHdr">
        <span class="console-title"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg> Console</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <button style="font-size:0.65rem;color:var(--txt3);" id="btnClearLog">Clear</button>
          <span id="consoleChev" style="font-size:0.7rem;color:var(--txt3);">▲</span>
        </div>
      </div>
      <div class="console-body" id="consoleBody"></div>
    </div>
  </div>

  <div class="resizer" id="resizer"></div>

  <div class="preview-pane" id="prevPane">
    <div class="preview-header">
      <div style="display:flex;gap:6px;align-items:center;">
        <select class="styled" id="selDevice">
          <option value="full">Desktop</option>
          <option value="lap">Laptop (1024px)</option>
          <option value="tab">Tablet (768px)</option>

let mCode;

let syncLock = false;

function initMonaco() {
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  require(['vs/editor/editor.main'], () => {
    const p = activeProj();
    // Use HTML mode, which perfectly highlights mixed HTML, CSS, and JS
    mCode = monaco.editor.createModel(p.code, 'html');

    window.editor = monaco.editor.create(document.getElementById('monacoMount'), {
      model: mCode, theme:'vs-dark', automaticLayout:true, fontSize:13, fontFamily:"'JetBrains Mono',Consolas,monospace",
      tabSize:2, wordWrap:'on', quickSuggestions:{other:true,comments:false,strings:true}, formatOnType: true
    });

    window.editor.onDidChangeModelContent(() => {
      if (syncLock) return;
      activeProj().code = window.editor.getValue();
      activeProj().updated = Date.now();
      if (document.getElementById('chkAutoSave').checked) saveState();
      if (document.getElementById('chkAutoRun').checked) {
        clearTimeout(autoRunTimer);
        autoRunTimer = setTimeout(buildPreviewFull, 700);
      }
    });

    window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, buildPreviewFull);

/* ═══════════════════════════════════════
   PREVIEW BUILDER & INJECTOR
═══════════════════════════════════════ */
let designMode = false;
let selectedPath = null;

function buildPreviewFull() {
  if (!mCode) return;
  let rawCode = mCode.getValue();

  // Design mode injections (Styles for selection/resize, scripts for drag/drop/sync)
  const designStyle = `
  <style id="__cfs_design_style">
    [data-cfs-hover] { outline: 2px dashed rgba(91,106,240,0.5) !important; cursor: pointer !important; }
    [data-cfs-selected] { outline: 2px solid #5b6af0 !important; resize: both; overflow: auto; }
  </style>`;

  const designScript = `
  <script id="__cfs_design_script">
    let _sel = null;
    let _dragEl = null, _startX, _startY, _initX, _initY;

    function _path(el){if(!el||el===document.body)return 'body';const tag=el.tagName.toLowerCase();const par=el.parentElement;const sibs=par?Array.from(par.children).filter(c=>c.tagName===el.tagName):[];const idx=sibs.indexOf(el);const nth=sibs.length>1?':nth-of-type('+(idx+1)+')':'';return _path(par)+' > '+tag+nth;}
    
    // Clean and sync back to parent
    function syncToParent() {
      let clone = document.documentElement.cloneNode(true);
      let s1 = clone.querySelector('#__cfs_design_style'); if(s1) s1.remove();
      let s2 = clone.querySelector('#__cfs_design_script'); if(s2) s2.remove();
      clone.querySelectorAll('[data-cfs-hover], [data-cfs-selected]').forEach(el => { el.removeAttribute('data-cfs-hover'); el.removeAttribute('data-cfs-selected'); });
      window.parent.postMessage({ type: 'sync-full-code', code: '<!DOCTYPE html>\\n<html lang="en">\\n' + clone.innerHTML + '\\n</html>' }, '*');
    }

    // Resize Observer for native CSS resize tracking
    let ro = new ResizeObserver(() => { if(_sel) syncToParent(); });

    document.addEventListener('mouseover', e => { const el=e.target; if(el===document.body||el===document.documentElement)return; el.setAttribute('data-cfs-hover','1'); e.stopPropagation(); }, true);
    document.addEventListener('mouseout', e => { e.target.removeAttribute('data-cfs-hover'); }, true);
    
    document.addEventListener('mousedown', e => {
      if (e.target.hasAttribute('data-cfs-selected')) {
         _dragEl = e.target; _startX = e.clientX; _startY = e.clientY;
         let cs = window.getComputedStyle(_dragEl);
         if (cs.position === 'static') _dragEl.style.position = 'relative';
         _initX = parseFloat(cs.left) || 0; _initY = parseFloat(cs.top) || 0;
      }
    });
    
    document.addEventListener('mousemove', e => {
       if (_dragEl) {
           _dragEl.style.left = (_initX + e.clientX - _startX) + 'px';
           _dragEl.style.top = (_initY + e.clientY - _startY) + 'px';
       }
    });

    document.addEventListener('mouseup', () => { if(_dragEl) { _dragEl = null; syncToParent(); } });

    document.addEventListener('click', e => {
      if(_dragEl) return; // Prevent selection logic if we just finished dragging
      e.preventDefault(); e.stopPropagation();
      if(_sel) { _sel.removeAttribute('data-cfs-selected'); ro.unobserve(_sel); }
      _sel = e.target;
      if(_sel===document.body||_sel===document.documentElement){_sel=null; return;}
      
      _sel.setAttribute('data-cfs-selected','1');
      ro.observe(_sel);

      const cs=window.getComputedStyle(_sel);
      window.parent.postMessage({
        type:'select', path:_path(_sel), tag:_sel.tagName.toLowerCase(),
        text:_sel.childNodes.length===1&&_sel.childNodes[0].nodeType===3?_sel.textContent:null,
        innerHTML:_sel.innerHTML,
        styles:{color:cs.color, backgroundColor:cs.backgroundColor, fontSize:cs.fontSize, fontWeight:cs.fontWeight, padding:cs.padding, margin:cs.margin, borderRadius:cs.borderRadius, textAlign:cs.textAlign, display:cs.display, width:cs.width, height:cs.height, opacity:cs.opacity},
        attrs:{id:_sel.id||'',className:_sel.className||''}
      },'*');
    }, true);

    // Listen for inline style / content updates from Props panel
    window.addEventListener('message', e => {
      if(!e.data || e.data.type !== 'apply-inline') return;
      if(_sel) {
         if (e.data.prop === 'innerHTML') _sel.innerHTML = e.data.val;
         else _sel.style[e.data.prop] = e.data.val;
         syncToParent();
      }
    });
  <\/script>`;

  let srcdoc = rawCode;
  if (designMode) {
    // Inject styles before closing head, scripts before closing body
    if (srcdoc.includes('</head>')) srcdoc = srcdoc.replace('</head>', designStyle + '\n</head>');
    else srcdoc = designStyle + srcdoc;
    
    if (srcdoc.includes('</body>')) srcdoc = srcdoc.replace('</body>', designScript + '\n</body>');
    else srcdoc += designScript;
  }

  // Handle console overriding natively
  const consoleScript = `<script>
    (function(){
      var _l=console.log,_w=console.warn,_e=console.error;
      function _s(t,a){window.parent.postMessage({type:'log',lt:t,msg:a.map(x=>x===null?'null':x===undefined?'undefined':typeof x==='object'?JSON.stringify(x):String(x)).join(' ')},'*');}
      console.log=function(){_l.apply(this,arguments);_s('log',[].slice.call(arguments));};
      console.warn=function(){_w.apply(this,arguments);_s('warn',[].slice.call(arguments));};
      console.error=function(){_e.apply(this,arguments);_s('error',[].slice.call(arguments));};
      window.onerror=function(m,u,l){_s('error',[m+' (line '+l+')']);};
    })();
  <\/script>`;
  
  if (srcdoc.includes('<head>')) srcdoc = srcdoc.replace('<head>', '<head>\n' + consoleScript);

  document.getElementById('sandbox').srcdoc = srcdoc;
}

/* ═══════════════════════════════════════
   MESSAGE BUS (Two-Way Sync & Props)
═══════════════════════════════════════ */
window.addEventListener('message', e => {
  if (!e.data) return;
  if (e.data.type === 'log') addLog(e.data.lt, e.data.msg);
  if (e.data.type === 'select') handleElementSelect(e.data);
  if (e.data.type === 'sync-full-code') {
    // Receive clean code from iframe and update editor without triggering re-render
    syncLock = true;
    mCode.setValue(e.data.code);
    activeProj().code = e.data.code;
    syncLock = false;
  }
});

function handleElementSelect(data) {
  selectedPath = data.path;
  const body = document.getElementById('propsBody');
  const s = data.styles, a = data.attrs;

  body.innerHTML = `
    <div class="tag-chip">&lt;${data.tag}&gt;</div>
    <div style="font-size:0.65rem;color:var(--txt3);margin-bottom:12px;word-break:break-all;">${data.path}</div>
    ${data.innerHTML !== null ? `
    <div class="prop-group">
      <div class="prop-label">Inner HTML</div>
      <textarea id="pp-html" style="width:100%;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--txt);font-size:0.72rem;resize:vertical;min-height:60px;font-family:'JetBrains Mono',monospace;">${String(data.innerHTML).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
      <button class="small-btn" style="margin-top:5px;width:100%;" id="pp-html-apply">Apply HTML</button>
    </div>` : ''}
    <div class="prop-group">
      <div class="prop-label">Colors</div>
      <div class="prop-row"><span class="prop-name">Text Color</span><input type="color" class="prop-color" id="pp-color" value="${rgbToHex(s.color)}"></div>
      <div class="prop-row"><span class="prop-name">Background</span><input type="color" class="prop-color" id="pp-bg" value="${rgbToHex(s.backgroundColor)}"></div>
    </div>
    <div class="prop-group">
      <div class="prop-label">Typography & Size</div>
      <div class="prop-row"><span class="prop-name">Font Size</span><input class="prop-input" id="pp-fs" value="${s.fontSize}"></div>
      <div class="prop-row"><span class="prop-name">Font Weight</span><input class="prop-input" id="pp-fw" value="${s.fontWeight}"></div>
      <div class="prop-row"><span class="prop-name">Width</span><input class="prop-input" id="pp-w" value="${s.width}"></div>
      <div class="prop-row"><span class="prop-name">Height</span><input class="prop-input" id="pp-h" value="${s.height}"></div>
    </div>
    <button class="add-child-btn" id="pp-wrap-apply">Apply Style Changes</button>
  `;

  function applyInline(prop, val) {
    document.getElementById('sandbox').contentWindow.postMessage({ type: 'apply-inline', prop, val }, '*');
  }

  const ppHtml = document.getElementById('pp-html-apply');
  if (ppHtml) ppHtml.onclick = () => applyInline('innerHTML', document.getElementById('pp-html').value);

  document.getElementById('pp-color').oninput = e => applyInline('color', e.target.value);
  document.getElementById('pp-bg').oninput = e => applyInline('backgroundColor', e.target.value);
  document.getElementById('pp-wrap-apply').onclick = () => {
    applyInline('fontSize', document.getElementById('pp-fs').value);
    applyInline('fontWeight', document.getElementById('pp-fw').value);
    applyInline('width', document.getElementById('pp-w').value);
    applyInline('height', document.getElementById('pp-h').value);
  };
}
function rgbToHex(rgb) {
  if (!rgb || rgb === 'transparent' || !rgb.startsWith('rgb')) return '#000000';
  const parts = rgb.match(/\d+/g);
  if (!parts || parts.length < 3) return '#000000';
  return '#' + parts.slice(0,3).map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
}

function renderProjects() {
  const list = document.getElementById('projList');
  list.innerHTML = '';

    const el = document.createElement('div'); el.className = 'proj-item' + (id === S.activeId ? ' on' : '');
    el.innerHTML = `<div class="proj-name">${p.name}</div><div class="proj-date">${new Date(p.updated).toLocaleDateString()}</div><div class="proj-actions"><button class="proj-btn del" onclick="delProj('${id}')">Del</button></div>`;
    el.addEventListener('click', e => { if (e.target.closest('.proj-btn')) return; S.activeId = id; saveState(); if(mCode) mCode.setValue(p.code); renderProjects(); renderSnaps(); buildPreviewFull(); });
    list.appendChild(el);
  });
}

document.getElementById('btnNewProj').addEventListener('click', () => {
  document.getElementById('modalBd').classList.add('open');
  document.getElementById('modalOk').onclick = () => {
    const name = document.getElementById('modalInput').value.trim() || 'New Project';
    const id = 'p_' + Date.now();
    S.projects[id] = { name, code: TEMPLATES[0].code, snaps: [], updated: Date.now() };
    S.activeId = id; saveState(); if(mCode) mCode.setValue(S.projects[id].code);
    renderProjects(); document.getElementById('modalBd').classList.remove('open'); buildPreviewFull();
  };
});
document.getElementById('modalCancel').onclick = () => document.getElementById('modalBd').classList.remove('open');
window.delProj = function(id) { if(Object.keys(S.projects).length<=1){alert('Cannot delete last project!');return;} if(!confirm('Delete?'))return; delete S.projects[id]; if(S.activeId===id)S.activeId=Object.keys(S.projects)[0]; saveState(); if(mCode)mCode.setValue(activeProj().code); renderProjects(); }

function renderTemplates() {
  const grid = document.getElementById('tplGrid');
  grid.innerHTML = TEMPLATES.map(t => `<div class="tpl-card" onclick="applyTemplate('${t.id}')"><div class="tpl-name">${t.name}</div><div class="tpl-desc">${t.desc}</div></div>`).join('');
}
window.applyTemplate = function(tid) {
  const t = TEMPLATES.find(x => x.id === tid);
  const id = 'p_' + Date.now();
  S.projects[id] = { name: t.name, code: t.code, snaps: [], updated: Date.now() };
  S.activeId = id; saveState(); if(mCode) mCode.setValue(t.code); renderProjects();
  document.querySelector('.sb-btn[data-drawer="projects"]').click(); buildPreviewFull();
};

function renderSnaps() {
  const list = document.getElementById('snapList'), p = activeProj();
  if (!p.snaps || !p.snaps.length) { list.innerHTML = '<div class="empty-state">No snapshots yet. Press Ctrl+S.</div>'; return; }
  list.innerHTML = p.snaps.slice().reverse().map((sn, ri) => `<div class="snap-item"><div><div class="snap-meta">Version ${p.snaps.length - ri}</div><div class="snap-time">${new Date(sn.ts).toLocaleTimeString()}</div></div><button class="snap-restore" onclick="restoreSnap(${p.snaps.length - 1 - ri})">Restore</button></div>`).join('');
}
function saveSnap() {
  const p = activeProj(); if(!p.snaps) p.snaps=[];
  p.snaps.push({ ts:Date.now(), code:mCode.getValue() }); saveState(); renderSnaps(); addLog('log', 'Snapshot saved.');
}
document.getElementById('btnNewSnap').addEventListener('click', saveSnap);
window.restoreSnap = function(i) { const sn = activeProj().snaps[i]; if(sn && confirm('Restore snapshot?')){ mCode.setValue(sn.code); buildPreviewFull(); }};

/* ═══════════════════════════════════════
   CONSOLE & UTILS
═══════════════════════════════════════ */
const consolePanel=document.getElementById('consolePanel'), consoleBody=document.getElementById('consoleBody');
document.getElementById('consoleHdr').addEventListener('click', e => { if(e.target.closest('#btnClearLog'))return; consolePanel.classList.toggle('closed'); document.getElementById('consoleChev').textContent = consolePanel.classList.contains('closed') ? '▲' : '▼'; setTimeout(() => window.editor && window.editor.layout(), 310); });
document.getElementById('btnClearLog').addEventListener('click', () => { consoleBody.innerHTML = ''; });
function addLog(type, msg) {
  const el = document.createElement('div'); el.className = 'log-line ' + type;
  el.innerHTML = `<span style="color:var(--txt3);margin-right:6px;">[${new Date().toLocaleTimeString().split(' ')[0]}]</span>${String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;')}`;
  consoleBody.appendChild(el); consoleBody.scrollTop = consoleBody.scrollHeight;
  if (type === 'error' && consolePanel.classList.contains('closed')) document.getElementById('consoleHdr').click();
}

document.getElementById('btnRun').addEventListener('click', () => { buildPreviewFull(); addLog('log','Ran manually.'); });
document.getElementById('btnFmt').addEventListener('click', () => { window.editor && window.editor.getAction('editor.action.formatDocument').run(); });

/* Export & Import */
document.getElementById('btnExportHTML').addEventListener('click', () => {
  const p = activeProj(); const blob = new Blob([p.code], {type:'text/html'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = p.name.replace(/\s+/g,'_') + '.html'; a.click(); URL.revokeObjectURL(url);
});
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = ev => {
    const id = 'p_' + Date.now();
    S.projects[id] = { name: f.name.replace('.html',''), code: ev.target.result, snaps: [], updated: Date.now() };
    S.activeId = id; saveState(); if(mCode) mCode.setValue(ev.target.result); renderProjects(); buildPreviewFull();
  }; r.readAsText(f);
});

/* Devices & Theme */
document.getElementById('selDevice').addEventListener('change', e => document.getElementById('previewFrame').className = 'preview-frame' + (e.target.value!=='full'?' '+e.target.value:'') + (designMode?' design-on':''));
document.getElementById('btnOrientation').addEventListener('click', () => document.getElementById('previewFrame').classList.toggle('rotated'));
document.getElementById('btnTheme').addEventListener('click', () => {
  const isLight = document.body.getAttribute('data-theme') === 'light';
  document.body.setAttribute('data-theme', isLight ? '' : 'light');
  if (window.editor) monaco.editor.setTheme(isLight ? 'vs-dark' : 'vs');
  if (!isLight) { document.body.style.setProperty('--bg','#ffffff'); document.body.style.setProperty('--bg2','#f8fafc'); document.body.style.setProperty('--bg3','#f1f5f9'); document.body.style.setProperty('--bg4','#e2e8f0'); document.body.style.setProperty('--border','rgba(0,0,0,0.08)'); document.body.style.setProperty('--txt','#0f172a'); }
  else { ['--bg','--bg2','--bg3','--bg4','--border','--txt'].forEach(v => document.body.style.removeProperty(v)); }
});

/* Init */
window.addEventListener('DOMContentLoaded', () => {
  loadState(); renderProjects(); renderSnaps(); renderTemplates(); initMonaco();
});
</script>
</body>
</html>
