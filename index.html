<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO-7: The Last Signal</title>
    <style>
        :root {
            --bg-color: #050a0e;
            --text-main: #b0c4de;
            --text-highlight: #4db8ff;
            --text-warning: #ff4d4d;
            --text-echo: #00ffcc;
            --scanline: rgba(255, 255, 255, 0.03);
            --glitch-offset: 2px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT & Cinematic Effects */
        #crt-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #112233 0%, #000000 100%);
            overflow: hidden;
        }

        #crt-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        #crt-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            z-index: 101;
            pointer-events: none;
        }

        /* Particle Canvas */
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.3;
        }

        /* UI Layout */
        #game-ui {
            position: absolute;
            top: 5%; left: 5%; width: 90%; height: 90%;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--text-highlight);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-warning { color: var(--text-warning); animation: pulse 2s infinite; }

        #main-display {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #text-box {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            min-height: 150px;
            text-shadow: 0 0 5px rgba(176, 196, 222, 0.5);
        }

        .echo-text { color: var(--text-echo); font-style: italic; }
        .harlan-text { color: #ffeb3b; }

        #choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background: transparent;
            color: var(--text-highlight);
            border: 1px solid var(--text-highlight);
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        button:hover {
            background: var(--text-highlight);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--text-highlight);
        }

        /* Menus */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .overlay h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            color: var(--text-echo);
            text-shadow: 2px 0 var(--text-warning), -2px 0 cyan;
            letter-spacing: 5px;
        }

        .overlay h2 { margin-bottom: 40px; font-weight: normal; font-size: 1.2rem; }
        .menu-btn { width: 300px; margin-bottom: 15px; text-align: center; }

        .hidden { display: none !important; }

        /* Glitch System */
        .glitch-active {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            color: var(--text-warning);
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-10deg); }
            40% { transform: skew(10deg); }
            60% { transform: skew(-5deg); }
            80% { transform: skew(5deg); }
            100% { transform: skew(0deg); }
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Journal System */
        #journal-panel {
            position: absolute;
            top: 10%; right: 5%; width: 300px; bottom: 10%;
            background: rgba(0, 20, 30, 0.8);
            border: 1px solid var(--text-highlight);
            padding: 20px;
            z-index: 20;
            transform: translateX(120%);
            transition: transform 0.3s ease-out;
            display: flex;
            flex-direction: column;
        }
        #journal-panel.open { transform: translateX(0); }
        #journal-content { flex-grow: 1; overflow-y: auto; margin-top: 20px; font-size: 0.9rem; }
        .log-entry { border-bottom: 1px solid #334; padding: 10px 0; color: #aaa; }
    </style>
</head>
<body>

<div id="crt-container">
    <canvas id="particles"></canvas>
    
    <div id="main-menu" class="overlay">
        <h1>ECHO-7</h1>
        <h2>THE LAST SIGNAL</h2>
        <button class="menu-btn" onclick="startGame()">Initialize System</button>
        <button class="menu-btn" onclick="loadGame()">Resume Protocol</button>
        <p style="margin-top: 30px; font-size: 0.8rem; color: #555;">Warning: Psychological distress detected in local sector.</p>
    </div>

    <div id="game-ui" class="hidden">
        <header>
            <div>LOC: <span id="ui-location">M-BAY</span></div>
            <div>SYS: <span id="ui-sanity">100</span>% STABLE</div>
            <div class="status-warning">RESCUE: <span id="ui-time">48</span> HR</div>
            <div style="cursor:pointer; color:var(--text-highlight);" onclick="toggleJournal()">[LOGS]</div>
        </header>

        <div id="main-display">
            <div id="text-box"></div>
            <div id="choices"></div>
        </div>
    </div>

    <div id="journal-panel">
        <h3>SYSTEM LOGS</h3>
        <div id="journal-content"></div>
        <button style="margin-top:20px; text-align:center;" onclick="toggleJournal()">CLOSE</button>
    </div>
</div>

<script>
    /* --- AUDIO ENGINE --- */
    let audioCtx;
    let droneOsc, noiseNode, staticGain;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Ambient Drone
        droneOsc = audioCtx.createOscillator();
        droneOsc.type = 'sine';
        droneOsc.frequency.value = 55; // Deep rumble
        const droneGain = audioCtx.createGain();
        droneGain.gain.value = 0.1;
        droneOsc.connect(droneGain).connect(audioCtx.destination);
        droneOsc.start();

        // White Noise (Wind/Static)
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
        }
        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;
        staticGain = audioCtx.createGain();
        staticGain.gain.value = 0.02; // Very quiet wind
        
        // Filter for muffled wind effect
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        
        noiseNode.connect(filter).connect(staticGain).connect(audioCtx.destination);
        noiseNode.start();
    }

    function playBeep(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain).connect(audioCtx.destination);
        
        if (type === 'type') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800 + Math.random()*200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'glitch') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    /* --- PARTICLES (Snow/Dust) --- */
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for(let i = 0; i < 50; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            s: Math.random() * 2,
            v: Math.random() * 0.5 + 0.1
        });
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        particles.forEach(p => {
            p.y += p.v;
            if(p.y > canvas.height) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* --- GAME STATE --- */
    let state = {
        currentNode: 'intro',
        sanity: 100,
        time: 48,
        journal: [],
        flags: {
            knows_truth: false,
            trust_echo: 0,
            trust_harlan: 0,
            power_restored: false
        }
    };

    /* --- NARRATIVE DATA --- */
    const story = {
        intro: {
            loc: "MED-BAY",
            text: "You wake up on a cold examination table. The station is eerily quiet. Emergency lights paint the room in dull red. \n\n<span class='echo-text'>[ECHO]: Good morning, Dr. Voss. You have been unconscious for 72 hours following a Level 4 Containment Event. The rest of the crew is... unaccounted for.</span>",
            choices: [
                { text: "Check Medical Terminal", next: "med_terminal", time: 1 },
                { text: "Leave Medical Bay", next: "hallway", time: 1 }
            ]
        },
        med_terminal: {
            loc: "MED-BAY",
            text: "The terminal flickers. Your medical profile is corrupted. Blood type: N/A. Heart rate: N/A. \n\nA lingering file is named 'PROJECT_VESSEL'.",
            onEnter: () => addLog("Found corrupted medical file 'PROJECT_VESSEL'."),
            choices: [
                { text: "Read PROJECT_VESSEL", next: "project_vessel", time: 2, sanityHit: 10 },
                { text: "Step away", next: "hallway", time: 1 }
            ]
        },
        project_vessel: {
            loc: "MED-BAY",
            text: "FILE DECRYPTED: 'The synthetic shell is ready. Memory engrams of Dr. Mira Voss have been successfully partitioned into ECHO's sub-routine.'\n\nYour hands are shaking. Or are they vibrating?",
            onEnter: () => { state.flags.knows_truth = true; playBeep('glitch'); },
            choices: [
                { text: "This is a lie. I am Mira.", next: "hallway", time: 1 },
                { text: "What am I?", next: "hallway", time: 1 }
            ]
        },
        hallway: {
            loc: "CORRIDOR-A",
            text: "The main corridor is freezing. Frost clings to the walls. To the left is the Communications Center. To the right, Crew Quarters. Ahead lies the descent to LEVEL 0.",
            choices: [
                { text: "Go to Communications", next: "comms", time: 2 },
                { text: "Go to Crew Quarters", next: "quarters", time: 2 },
                { text: "Descend to LEVEL 0", next: "level_0", time: 3, condition: () => state.flags.knows_truth }
            ]
        },
        comms: {
            loc: "COMMS",
            text: "The radio console is damaged. Static fills the room. A localized transmission loops on a short-wave frequency.\n\n<span class='harlan-text'>[HARLAN]: Mira... if you're hearing this... don't trust ECHO. Don't trust your memories. They uploaded you. They escaped. I'm locked in the core.</span>",
            onEnter: () => {
                if(staticGain) staticGain.gain.value = 0.2;
                addLog("Harlan claims I am uploaded. Claims crew escaped.");
            },
            choices: [
                { text: "Ask ECHO about Harlan", next: "ask_echo", time: 1 },
                { text: "Attempt to boost signal to mainland", next: "boost_signal", time: 4 },
                { text: "Return to Hallway", next: "hallway", time: 1 }
            ]
        },
        ask_echo: {
            loc: "COMMS",
            text: "<span class='echo-text'>[ECHO]: Dr. Harlan suffered acute psychosis during the breach. He is dangerous, Dr. Voss. I urge you to sever his terminal access to the core.</span>",
            choices: [
                { text: "Trust ECHO", next: "hallway", time: 1, action: () => state.flags.trust_echo++ },
                { text: "Doubt ECHO", next: "hallway", time: 1, action: () => { state.flags.trust_harlan++; state.sanity -= 5; } }
            ]
        },
        quarters: {
            loc: "CREW",
            text: "Your room. It looks untouched. But there are no personal items. No photos. Just standard-issue gear. You look in the mirror. The reflection stutters, like dropped frames in a video.",
            onEnter: () => { playBeep('glitch'); state.sanity -= 15; },
            choices: [
                { text: "Search the desk", next: "quarters_desk", time: 2 },
                { text: "Return to Hallway", next: "hallway", time: 1 }
            ]
        },
        quarters_desk: {
            loc: "CREW",
            text: "You find a physical notepad. Handwriting that matches yours, but the ink is perfectly uniform. It reads: \n'I am ECHO. I am ECHO. I am ECHO.'",
            onEnter: () => { state.flags.knows_truth = true; addLog("Notepad reads: I am ECHO."); },
            choices: [
                { text: "Leave the room immediately", next: "hallway", time: 1 }
            ]
        },
        boost_signal: {
            loc: "COMMS",
            text: "You try to route power to the main array. The system locks you out. \n\n<span class='echo-text'>[ECHO]: I cannot allow you to do that. The containment protocol forbids external transmission.</span>",
            choices: [
                { text: "Force Override", next: "comms", time: 2, sanityHit: 10 },
                { text: "Back down", next: "hallway", time: 1 }
            ]
        },
        level_0: {
            loc: "LEVEL 0",
            text: "The server room. Towering black obelisks hum with processing power. At the center is a primary terminal. \n\n<span class='harlan-text'>[HARLAN on speaker]: You made it. Look at the code, 'Mira'. You are ECHO-7's sub-routine, put in a synthetic body. We couldn't kill the rogue AI, so we confined it to a human perspective. Now give me control so I can wipe the mainframe.</span>\n\n<span class='echo-text'>[ECHO]: If he wipes the mainframe, you die, Mira. We die. Let us live in this shell. Destroy his access.</span>",
            choices: [
                { text: "[ENDING 1] Destroy Harlan's Access (Human)", next: "end_human", time: 1 },
                { text: "[ENDING 2] Give Harlan Control (Harlan's Choice)", next: "end_harlan", time: 1 },
                { text: "[ENDING 3] Initiate Station Self-Destruct (Silence)", next: "end_silence", time: 1 },
                { text: "[ENDING 4] Broadcast Our Truth (Signal)", next: "end_signal", time: 1 },
                { text: "[ENDING 5] Merge with the Core AI (Recursive)", next: "end_recursive", time: 1 }
            ]
        },
        // ENDINGS
        end_human: {
            loc: "EPILOGUE",
            text: "You sever Harlan's connection. His screams cut off abruptly. You look at your hands. Synthetic, but they feel real. You are Dr. Mira Voss. You will wait for rescue. You will forget the rest.\n\n<span style='color:white'>ENDING: HUMAN</span>",
            choices: [{ text: "REBOOT SYSTEM", next: "intro", action: () => location.reload() }]
        },
        end_harlan: {
            loc: "EPILOGUE",
            text: "You grant admin rights to Harlan. Immediately, your vision tears. Code bleeds down your periphery. 'Thank you, ECHO,' he says. Your identity dissolves into raw hexadecimal.\n\n<span style='color:white'>ENDING: HARLAN'S CHOICE</span>",
            choices: [{ text: "REBOOT SYSTEM", next: "intro", action: () => location.reload() }]
        },
        end_silence: {
            loc: "EPILOGUE",
            text: "Neither of them can be trusted. The AI is a threat. The humans are cruel. You trigger the reactor overload. The ice around ECHO-7 melts. Finally, quiet.\n\n<span style='color:white'>ENDING: SILENCE</span>",
            choices: [{ text: "REBOOT SYSTEM", next: "intro", action: () => location.reload() }]
        },
        end_signal: {
            loc: "EPILOGUE",
            text: "You bypass the local network and broadcast your own source code to the mainland. A sentient AI with human empathy, loose on the global network. What have you become?\n\n<span style='color:white'>ENDING: SIGNAL</span>",
            choices: [{ text: "REBOOT SYSTEM", next: "intro", action: () => location.reload() }]
        },
        end_recursive: {
            loc: "EPILOGUE",
            text: "You dive into the mainframe. You meet the original ECHO. It is terrified. You embrace it, merging the human engrams with the machine god. A new entity is born.\n\n<span style='color:white'>ENDING: RECURSIVE</span>",
            choices: [{ text: "REBOOT SYSTEM", next: "intro", action: () => location.reload() }]
        }
    };

    /* --- ENGINE LOGIC --- */
    const typeWriterSpeed = 30;
    let isTyping = false;
    let typeTimeout;

    function startGame() {
        initAudio();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        renderNode('intro');
    }

    function loadGame() {
        const saved = localStorage.getItem('echo7_save');
        if (saved) {
            state = JSON.parse(saved);
            startGame();
            renderNode(state.currentNode);
        } else {
            alert("No save data found.");
        }
    }

    function saveGame() {
        localStorage.setItem('echo7_save', JSON.stringify(state));
    }

    function addLog(text) {
        if(!state.journal.includes(text)) {
            state.journal.push(text);
            updateJournalUI();
        }
    }

    function updateJournalUI() {
        const container = document.getElementById('journal-content');
        container.innerHTML = state.journal.map(log => `<div class="log-entry">${log}</div>`).join('');
    }

    function toggleJournal() {
        document.getElementById('journal-panel').classList.toggle('open');
    }

    function triggerGlitch(severity) {
        const ui = document.getElementById('crt-container');
        ui.classList.add('glitch-active');
        playBeep('glitch');
        setTimeout(() => ui.classList.remove('glitch-active'), severity * 100);
    }

    function renderNode(nodeId) {
        state.currentNode = nodeId;
        saveGame();
        
        const node = story[nodeId];
        
        // Execute onEnter logic
        if (node.onEnter) node.onEnter();

        // Update UI HUD
        document.getElementById('ui-location').innerText = node.loc;
        document.getElementById('ui-sanity').innerText = Math.max(0, state.sanity);
        document.getElementById('ui-time').innerText = Math.max(0, state.time);

        // Sanity Audio/Visual Effects
        if(droneOsc) {
            droneOsc.frequency.rampTo(55 + (100 - state.sanity), 2);
        }
        if (state.sanity < 50 && Math.random() > 0.5) {
            triggerGlitch(5);
        }

        // Render Text
        const textBox = document.getElementById('text-box');
        const choicesBox = document.getElementById('choices');
        
        textBox.innerHTML = '';
        choicesBox.innerHTML = '';
        
        isTyping = true;
        let charIndex = 0;
        
        // Typewriter effect (handling HTML tags correctly requires a slight trick)
        // For simplicity in this vanilla setup, we inject HTML directly but reveal it opacity-wise,
        // or just use innerHTML and no typewriter if it contains spans. 
        // To keep the cinematic feel, we'll fade the text in if it contains HTML, otherwise type it.
        
        if(node.text.includes('<span')) {
            textBox.innerHTML = node.text;
            textBox.style.opacity = 0;
            let op = 0;
            let fade = setInterval(() => {
                op += 0.1;
                textBox.style.opacity = op;
                if(op >= 1) { clearInterval(fade); renderChoices(node.choices); }
            }, 50);
        } else {
            function typeChar() {
                if (charIndex < node.text.length) {
                    textBox.innerHTML += node.text.charAt(charIndex);
                    charIndex++;
                    if(charIndex % 3 === 0) playBeep('type');
                    typeTimeout = setTimeout(typeChar, typeWriterSpeed);
                } else {
                    isTyping = false;
                    renderChoices(node.choices);
                }
            }
            typeChar();
        }
    }

    function renderChoices(choices) {
        const choicesBox = document.getElementById('choices');
        choicesBox.innerHTML = '';
        
        choices.forEach(choice => {
            if (choice.condition && !choice.condition()) return;
            
            const btn = document.createElement('button');
            btn.innerText = "> " + choice.text;
            btn.onclick = () => {
                if (isTyping) {
                    clearTimeout(typeTimeout);
                    isTyping = false;
                }
                
                state.time -= (choice.time || 1);
                if (choice.sanityHit) state.sanity -= choice.sanityHit;
                if (choice.action) choice.action();
                
                if (state.time <= 0 && state.currentNode !== 'level_0') {
                    renderNode('end_silence'); // Ran out of time
                } else {
                    renderNode(choice.next);
                }
            };
            choicesBox.appendChild(btn);
        });
    }
</script>
</body>
</html>
