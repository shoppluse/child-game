<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECHO-7: The Awakening</title>
    <style>
        /* =========================================================
           GLOBAL STYLING & THRILLER THEME
           ========================================================= */
        :root {
            --bg-color: #050508;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --text-accent: #38bdf8;
            --text-danger: #ef4444;
            --border-color: #1e293b;
            --font-serif: 'Georgia', serif;
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: 'Arial', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-serif);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* Ambient FX Layer (Visual only, no audio) */
        #fx-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            opacity: 0.8;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 130%);
            z-index: 9;
            pointer-events: none;
        }

        /* Thriller Flash Effects */
        #threat-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(239, 68, 68, 0.4);
            z-index: 999;
            pointer-events: none;
            opacity: 0;
        }

        .flash-anim {
            animation: flashOut 1s ease-out;
        }

        @keyframes flashOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Screen Shake */
        .shake-active {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 1px, 0); }
            20%, 80% { transform: translate3d(4px, -2px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 3px, 0); }
            40%, 60% { transform: translate3d(6px, -3px, 0); }
        }

        /* Glitch Text Effect */
        .glitch-text {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            color: var(--text-danger);
            text-shadow: 2px 0 blue, -2px 0 red;
            font-weight: bold;
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-10deg); }
            40% { transform: skew(10deg); }
            60% { transform: skew(-5deg); }
            80% { transform: skew(5deg); }
            100% { transform: skew(0deg); }
        }

        /* =========================================================
           SCREENS & UI
           ========================================================= */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background-color: var(--bg-color);
            transition: opacity 1s ease;
        }

        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* Main Menu */
        #main-menu h1 {
            font-family: var(--font-sans);
            font-size: 3rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        #main-menu h3 {
            font-size: 1rem;
            letter-spacing: 5px;
            color: var(--text-muted);
            margin-bottom: 50px;
        }

        .btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 12px 24px;
            font-family: var(--font-sans);
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 250px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .btn:hover, .btn:focus {
            color: #fff;
            border-color: var(--text-danger);
            background: rgba(239, 68, 68, 0.05);
            letter-spacing: 4px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Game UI */
        #game-ui {
            z-index: 15;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            height: 100%;
            padding: 20px;
            background: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .threat-high { color: var(--text-danger); font-weight: bold; }

        #story-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        #story-text {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 40px;
            white-space: pre-wrap;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        #choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .choice-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 18px 20px;
            font-family: var(--font-sans);
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .choice-btn::before {
            content: "▸";
            margin-right: 12px;
            color: var(--text-danger);
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .choice-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }
        .choice-btn:hover::before {
            transform: translateX(5px);
        }

        footer {
            display: flex;
            justify-content: space-around;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .nav-btn {
            background: none; border: none; 
            color: var(--text-muted);
            cursor: pointer; 
            font-family: var(--font-mono);
            letter-spacing: 1px; 
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .nav-btn:hover { color: #fff; }
        .nav-btn.alert { color: var(--text-danger); font-weight: bold; }

        /* Modals */
        .modal {
            position: absolute;
            top: 5%; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 450px;
            height: 85%;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 8px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        .modal-header {
            background: #151515;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-family: var(--font-mono);
            font-weight: bold;
            color: var(--text-danger);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.5rem; }
        .modal-content { flex-grow: 1; overflow-y: auto; padding: 20px; font-family: var(--font-sans); }

        .sms-bubble { max-width: 85%; padding: 12px 16px; border-radius: 12px; margin-bottom: 15px; line-height: 1.4; clear: both; }
        .sms-received { background: #1e293b; color: #fff; float: left; border-bottom-left-radius: 2px; border-left: 2px solid var(--text-danger); }
        .sms-sent { background: #0284c7; color: #fff; float: right; border-bottom-right-radius: 2px; }
        .sms-sender { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 5px; clear: both; font-family: var(--font-mono); text-transform: uppercase;}

        .evidence-card { background: #111; border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-left: 3px solid #fff; }
        .evidence-title { font-weight: bold; color: #fff; margin-bottom: 5px; font-family: var(--font-mono); }
        .evidence-desc { color: #999; font-size: 0.9rem; line-height: 1.5; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>

    <div id="fx-layer"></div>
    <div class="vignette"></div>
    <div id="threat-flash"></div>

    <div id="main-menu" class="screen">
        <h1>THE TRUTH</h1>
        <h3>BEHIND THE FALL</h3>
        <button class="btn" onclick="UI.startGame()">New Investigation</button>
        <button class="btn" id="btn-continue" onclick="UI.loadGame()">Continue</button>
        <div style="margin-top: 40px; font-family: monospace; font-size: 0.7rem; color: #444;">SYSTEM v2.0 | NO BACKGROUND LOOP</div>
    </div>

    <div id="game-ui" class="screen hidden">
        <header>
            <div id="hud-chapter">Prologue</div>
            <div id="hud-threat">Threat: LOW</div>
            <div id="hud-time">03:47 AM</div>
        </header>

        <div id="story-container">
            <div id="story-text"></div>
            <div id="choices-container"></div>
        </div>

        <footer>
            <button class="nav-btn" id="btn-phone" onclick="Modals.open('phone')">📱 Phone</button>
            <button class="nav-btn" id="btn-evidence" onclick="Modals.open('evidence')">🗂 Evidence</button>
            <button class="nav-btn" id="btn-journal" onclick="Modals.open('journal')">📓 Journal</button>
            <button class="nav-btn" onclick="Engine.saveGame()">💾 Save</button>
        </footer>
    </div>

    <div id="modal-phone" class="modal hidden">
        <div class="modal-header">
            <span>SECURE INBOX</span>
            <button class="close-btn" onclick="Modals.close()">×</button>
        </div>
        <div class="modal-content" id="phone-content"></div>
    </div>

    <div id="modal-evidence" class="modal hidden">
        <div class="modal-header">
            <span>EVIDENCE BOARD</span>
            <button class="close-btn" onclick="Modals.close()">×</button>
        </div>
        <div class="modal-content" id="evidence-content"></div>
    </div>

    <div id="modal-journal" class="modal hidden">
        <div class="modal-header">
            <span>INVESTIGATION NOTES</span>
            <button class="close-btn" onclick="Modals.close()">×</button>
        </div>
        <div class="modal-content" id="journal-content"></div>
    </div>

<script>
/**
 * =========================================================
 * AUDIO ENGINE (Event-Based Thriller Sounds Only)
 * NO CONTINUOUS DRONES
 * =========================================================
 */
const AudioEngine = {
    ctx: null,
    masterGain: null,

    init() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.6;
        this.masterGain.connect(this.ctx.destination);
    },

    playType() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain).connect(this.masterGain);
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(300 + Math.random() * 100, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.start(); osc.stop(this.ctx.currentTime + 0.04);
    },

    playNotification() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain).connect(this.masterGain);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.start(); osc.stop(this.ctx.currentTime + 0.4);
    },

    // A sharp, startling sound for jumpscares / bad news
    playSting() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain).connect(this.masterGain);
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.6);
        
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
        
        osc.start(); osc.stop(this.ctx.currentTime + 0.6);
    },

    // A deep double-thump used during tense choices
    playHeartbeat() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        
        // Thump 1
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.connect(gain1).connect(this.masterGain);
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(50, now);
        osc1.frequency.exponentialRampToValueAtTime(20, now + 0.2);
        gain1.gain.setValueAtTime(0, now);
        gain1.gain.linearRampToValueAtTime(1, now + 0.05);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc1.start(now); osc1.stop(now + 0.3);

        // Thump 2
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.connect(gain2).connect(this.masterGain);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(55, now + 0.3);
        osc2.frequency.exponentialRampToValueAtTime(25, now + 0.5);
        gain2.gain.setValueAtTime(0, now + 0.3);
        gain2.gain.linearRampToValueAtTime(1, now + 0.35);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc2.start(now + 0.3); osc2.stop(now + 0.6);
    }
};

/**
 * =========================================================
 * GAME STATE MANAGEMENT
 * =========================================================
 */
let gameState = {
    currentNode: 'prologue_start',
    chapter: 'Prologue',
    time: '03:47 AM',
    threatLevel: 0,
    evidence: [],
    messages: [],
    journal: []
};

const Engine = {
    saveGame() {
        localStorage.setItem('echo7_save2', JSON.stringify(gameState));
        UI.flashNav('💾 Saved');
    },
    loadGame() {
        const saved = localStorage.getItem('echo7_save2');
        if (saved) {
            gameState = JSON.parse(saved);
            return true;
        }
        return false;
    },
    hasSave() { return localStorage.getItem('echo7_save2') !== null; },
    
    addEvidence(id, title, desc) {
        if (!gameState.evidence.find(e => e.id === id)) {
            gameState.evidence.push({id, title, desc});
            document.getElementById('btn-evidence').classList.add('alert');
            AudioEngine.playNotification();
        }
    },
    addMessage(sender, text, isReceived = true) {
        gameState.messages.push({sender, text, isReceived});
        document.getElementById('btn-phone').classList.add('alert');
        if(isReceived) AudioEngine.playNotification();
    },
    addJournal(entry) {
        if(!gameState.journal.includes(entry)){
            gameState.journal.push(entry);
            document.getElementById('btn-journal').classList.add('alert');
        }
    }
};

/**
 * =========================================================
 * USER INTERFACE & MODALS
 * =========================================================
 */
const Modals = {
    active: null,
    open(type) {
        AudioEngine.playType();
        this.close();
        document.getElementById(`modal-${type}`).classList.remove('hidden');
        document.getElementById(`btn-${type}`).classList.remove('alert');
        this.active = type;
        this.populate(type);
    },
    close() {
        if (this.active) {
            document.getElementById(`modal-${this.active}`).classList.add('hidden');
            this.active = null;
        }
    },
    populate(type) {
        const container = document.getElementById(`${type}-content`);
        container.innerHTML = '';

        if (type === 'phone') {
            if(gameState.messages.length === 0) container.innerHTML = '<p style="color:#555;text-align:center;margin-top:20px;">Inbox empty.</p>';
            gameState.messages.forEach(msg => {
                const alignClass = msg.isReceived ? 'sms-received' : 'sms-sent';
                const senderDiv = msg.isReceived ? `<div class="sms-sender">${msg.sender}</div>` : '';
                container.innerHTML += `${senderDiv}<div class="sms-bubble ${alignClass}">${msg.text}</div>`;
            });
        } 
        else if (type === 'evidence') {
            if(gameState.evidence.length === 0) container.innerHTML = '<p style="color:#555;text-align:center;margin-top:20px;">Board empty.</p>';
            gameState.evidence.forEach(ev => {
                container.innerHTML += `<div class="evidence-card"><div class="evidence-title">${ev.title}</div><div class="evidence-desc">${ev.desc}</div></div>`;
            });
        }
        else if (type === 'journal') {
            if(gameState.journal.length === 0) container.innerHTML = '<p style="color:#555;text-align:center;margin-top:20px;">No entries.</p>';
            gameState.journal.forEach(entry => {
                container.innerHTML += `<p style="margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid #1e293b; line-height:1.5;">- ${entry}</p>`;
            });
        }
    }
};

const UI = {
    typingTimer: null,

    init() {
        if(Engine.hasSave()) document.getElementById('btn-continue').disabled = false;
        else document.getElementById('btn-continue').disabled = true;
    },
    startGame() {
        AudioEngine.init();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('game-ui').classList.remove('hidden');
        gameState = {
            currentNode: 'prologue_start', chapter: 'Prologue', time: '03:47 AM', threatLevel: 0,
            evidence: [], messages: [], journal: []
        };
        StoryEngine.renderNode(gameState.currentNode);
    },
    loadGame() {
        AudioEngine.init();
        if(Engine.loadGame()) {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            StoryEngine.renderNode(gameState.currentNode, true);
        }
    },
    flashNav(text) {
        const saveBtn = document.querySelectorAll('.nav-btn')[3];
        saveBtn.innerText = text;
        setTimeout(() => saveBtn.innerText = "💾 Save", 2000);
    },
    triggerScare() {
        // Physical visual and audio scare
        AudioEngine.playSting();
        
        // Shake screen
        const gameBody = document.getElementById('game-ui');
        gameBody.classList.remove('shake-active');
        void gameBody.offsetWidth; // trigger reflow
        gameBody.classList.add('shake-active');

        // Red flash
        const flash = document.getElementById('threat-flash');
        flash.classList.remove('flash-anim');
        void flash.offsetWidth;
        flash.classList.add('flash-anim');
    },
    updateHUD() {
        document.getElementById('hud-chapter').innerText = gameState.chapter;
        document.getElementById('hud-time').innerText = gameState.time;
        
        const threatEl = document.getElementById('hud-threat');
        if (gameState.threatLevel >= 50) {
            threatEl.innerText = "THREAT: CRITICAL";
            threatEl.className = "threat-high";
            AudioEngine.playHeartbeat(); // Adds a heartbeat thump when UI updates at high threat
        } else if (gameState.threatLevel >= 25) {
            threatEl.innerText = "THREAT: ELEVATED";
            threatEl.className = "";
        } else {
            threatEl.innerText = "THREAT: LOW";
            threatEl.className = "";
        }
    },
    typeText(text, isGlitch, callback) {
        const container = document.getElementById('story-text');
        container.innerHTML = '';
        let i = 0;
        clearTimeout(this.typingTimer);

        // Apply glitch styling if flagged
        if (isGlitch) {
            container.classList.add('glitch-text');
            this.triggerScare();
        } else {
            container.classList.remove('glitch-text');
        }

        function type() {
            if (i < text.length) {
                if(text.charAt(i) === '<' && text.substring(i, i+4) === '<br>') {
                    container.innerHTML += '<br>';
                    i += 4;
                } else {
                    container.innerHTML += text.charAt(i);
                    i++;
                }
                if (i % 4 === 0) AudioEngine.playType();
                UI.typingTimer = setTimeout(type, 15);
            } else {
                if(callback) callback();
            }
        }
        type();
    }
};

/**
 * =========================================================
 * STORY ENGINE & NARRATIVE DATA
 * =========================================================
 */
const StoryNodes = {
    "prologue_start": {
        chapter: "Prologue", time: "03:47 AM",
        text: "Your phone wakes you at 3:47 AM.<br><br>Not an alarm. Not a call. A text from a number you don't recognise — eleven digits, no country code, no name. The screen glows in the dark of your flat in Koramangala. Your ceiling fan hums. Somewhere outside, a dog barks twice and stops.",
        onEnter: () => {
            Engine.addMessage("Unknown Sender", "He told us you'd delete this. Don't. Your brother didn't fall.");
            Engine.addJournal("Received a strange text at 3:47 AM claiming Arjun's death wasn't an accident.");
        },
        choices: [ { text: "Read the message on your Phone.", next: "prologue_read" } ]
    },
    "prologue_read": {
        chapter: "Prologue", time: "03:49 AM",
        text: "You sit up. Your mouth is dry.<br><br>Your brother Arjun died eight months ago. The police report said he fell from the terrace of his apartment building in Whitefield. Sixth floor. The investigation lasted eleven days and was closed with a single word: accidental.<br><br>You believed them. You had no reason not to.",
        choices: [
            { text: "Reply: 'Who is this?'", next: "prologue_reply" },
            { text: "Put the phone away and try to sleep.", next: "prologue_ignore" }
        ]
    },
    "prologue_reply": {
        chapter: "Prologue", time: "03:51 AM",
        text: "You stare at the message until the screen dims. Then you type back: 'Who is this?'<br><br>Three dots appear. Then they vanish. No reply comes.<br><br>You don't sleep again.",
        onEnter: () => Engine.addMessage("You", "Who is this?", false),
        choices: [ { text: "Wait until morning.", next: "ch1_start" } ]
    },
    "prologue_ignore": {
        chapter: "Prologue", time: "05:00 AM",
        text: "You try to close your eyes, but the words burn in your mind. 'Your brother didn't fall.'<br><br>You don't sleep again.",
        choices: [ { text: "Wait until morning.", next: "ch1_start" } ]

const StoryEngine = {
    renderNode(nodeId, skipType = false) {
        gameState.currentNode = nodeId;
        const node = StoryNodes[nodeId];
        
        if (node.onEnter) node.onEnter();

        gameState.chapter = node.chapter || gameState.chapter;
        gameState.time = node.time || gameState.time;
        UI.updateHUD();

        const choicesContainer = document.getElementById('choices-container');
        choicesContainer.innerHTML = ''; 

        if (skipType) {
            const container = document.getElementById('story-text');
            container.innerHTML = node.text.replace(/<br>/g, '<br>');
            if(node.isScary) container.classList.add('glitch-text');
            else container.classList.remove('glitch-text');
            this.renderChoices(node.choices);
        } else {
            UI.typeText(node.text, node.isScary, () => {
                this.renderChoices(node.choices);
            });
        }
    },
    renderChoices(choices) {
        const container = document.getElementById('choices-container');
        container.innerHTML = '';
        if(!choices) return;
        
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = c.text;
            btn.onclick = () => {
                AudioEngine.playType();
                // Play heartbeat on choice selection if tension is high
                if(gameState.threatLevel >= 50) AudioEngine.playHeartbeat();
                this.renderNode(c.next);
            };
            container.appendChild(btn);
        });
    }
};

// Start UI Initialization
window.onload = () => { UI.init(); };
