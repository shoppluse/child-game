<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeForge Studio v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<style>
:root {
  --bg: #0a0b0f;
  --bg2: #0f1117;
  --bg3: #161821;
  --bg4: #1e2130;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --accent: #5b6af0;
  --accent2: #a78bfa;
  --accent-glow: rgba(91,106,240,0.3);
  --green: #34d399;
  --red: #f87171;
  --yellow: #fbbf24;
  --txt: #eef0f8;
  --txt2: #8892a4;
  --txt3: #4a5568;
  --sidebar-w: 52px;
  --drawer-w: 240px;
  --header-h: 44px;
  --tab-h: 34px;
  --radius: 8px;
  --trans: 0.18s ease;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;display:flex;}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;}
input,select,textarea{font-family:inherit;outline:none;color:var(--txt);}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:12px 0;gap:4px;z-index:20;flex-shrink:0;
}
.logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  margin-bottom:8px;box-shadow:0 0 20px var(--accent-glow);
  flex-shrink:0;
}
.logo svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;}
.sb-btn{
  width:38px;height:38px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  color:var(--txt3);transition:all var(--trans);position:relative;
}
.sb-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;}
.sb-btn:hover{color:var(--txt);background:var(--bg4);}
.sb-btn.on{color:var(--accent);background:var(--bg4);}
.sb-btn[data-tip]::after{
  content:attr(data-tip);position:absolute;left:calc(var(--sidebar-w) + 4px);
  background:#1e2130;color:var(--txt);padding:4px 8px;border-radius:5px;
  font-size:0.72rem;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity 0.15s;z-index:100;border:1px solid var(--border2);
}
.sb-btn:hover[data-tip]::after{opacity:1;}
.sb-sep{width:30px;height:1px;background:var(--border);margin:4px 0;}

/* ── DRAWER ── */
.drawer{
  width:var(--drawer-w);background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width var(--trans);flex-shrink:0;
}
.drawer.closed{width:0;border:none;}
.dh{
  height:var(--header-h);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;flex-shrink:0;
}
.dh-title{font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);}
.dc{flex:1;padding:12px;overflow-y:auto;}
.d-section{display:none;flex-direction:column;height:100%;}
.d-section.active{display:flex;}

/* Project list */
.proj-list{display:flex;flex-direction:column;gap:6px;}
.proj-item{
  padding:8px 10px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--bg3);
  cursor:pointer;transition:all var(--trans);
}
.proj-item:hover,.proj-item.on{border-color:var(--accent);}
.proj-item.on{background:var(--bg4);}
.proj-name{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proj-date{font-size:0.68rem;color:var(--txt3);margin-top:2px;}
.proj-actions{display:flex;gap:4px;margin-top:6px;}
.proj-btn{font-size:0.68rem;padding:2px 7px;border-radius:4px;border:1px solid var(--border2);color:var(--txt2);transition:all var(--trans);}
.proj-btn:hover{color:var(--txt);border-color:var(--txt2);}
.proj-btn.del:hover{color:var(--red);border-color:var(--red);}

/* Templates */
.tpl-card{
  padding:10px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--bg3);cursor:pointer;transition:all var(--trans);margin-bottom:6px;
}
.tpl-card:hover{border-color:var(--accent);}
.tpl-name{font-size:0.82rem;font-weight:700;margin-bottom:2px;}
.tpl-desc{font-size:0.7rem;color:var(--txt2);line-height:1.4;}
.tpl-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.tpl-tag{font-size:0.62rem;padding:1px 5px;border-radius:3px;background:var(--bg4);color:var(--txt3);}

/* CDN */
.cdn-item-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);margin-bottom:5px;}
.cdn-badge{font-size:0.6rem;font-weight:700;padding:1px 5px;border-radius:3px;flex-shrink:0;}
.cdn-badge.js{background:rgba(251,191,36,0.15);color:#fbbf24;}
.cdn-badge.css{background:rgba(96,165,250,0.15);color:#60a5fa;}
.cdn-url{font-size:0.68rem;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:'JetBrains Mono',monospace;}
.cdn-rm{color:var(--txt3);transition:color var(--trans);}
.cdn-rm:hover{color:var(--red);}
.cdn-add-row{display:flex;gap:6px;margin:8px 0;}
.cdn-input{flex:1;padding:6px 8px;font-size:0.75rem;background:var(--bg3);border:1px solid var(--border);border-radius:6px;font-family:'JetBrains Mono',monospace;}
.cdn-input:focus{border-color:var(--accent);}
.small-btn{padding:5px 10px;font-size:0.73rem;font-weight:600;border-radius:6px;border:1px solid var(--border2);color:var(--txt2);transition:all var(--trans);}
.small-btn:hover{color:var(--txt);border-color:var(--accent);}
.preset-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.preset-chip{font-size:0.68rem;padding:3px 8px;border-radius:12px;border:1px solid var(--border);color:var(--txt2);transition:all var(--trans);}
.preset-chip:hover{border-color:var(--accent);color:var(--txt);}
.preset-chip.added{border-color:var(--green);color:var(--green);}

/* Snapshot */
.snap-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);margin-bottom:5px;}
.snap-meta{font-size:0.72rem;font-weight:600;}
.snap-time{font-size:0.65rem;color:var(--txt3);margin-top:1px;}
.snap-restore{font-size:0.7rem;color:var(--accent);font-weight:600;}

/* ── WORKSPACE ── */
.workspace{display:flex;flex:1;overflow:hidden;position:relative;}

/* ── EDITOR PANE ── */
.editor-pane{
  display:flex;flex-direction:column;
  background:var(--bg2);overflow:hidden;
  width:50%;min-width:200px;
}
.pane-header{
  height:var(--header-h);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;flex-shrink:0;gap:8px;
}
.tab-bar{
  display:flex;height:var(--tab-h);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.tab{
  padding:0 16px;height:100%;display:flex;align-items:center;gap:6px;
  font-size:0.75rem;font-weight:600;color:var(--txt3);
  border-right:1px solid var(--border);cursor:pointer;transition:all var(--trans);
  position:relative;
}
.tab:hover{color:var(--txt2);}
.tab.on{color:var(--txt);background:var(--bg3);}
.tab.on::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);}
.tab-dot{width:8px;height:8px;border-radius:50%;}
.td-html{background:#e34c26;}
.td-css{background:#264de4;}
.td-js{background:#f7df1e;}
.editor-wrap{flex:1;overflow:hidden;position:relative;}

/* ── CONSOLE ── */
.console-panel{
  height:140px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
  transition:height var(--trans);
}
.console-panel.closed{height:30px;}
.console-hdr{
  height:30px;background:var(--bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;cursor:pointer;flex-shrink:0;
}
.console-title{font-size:0.7rem;font-weight:700;color:var(--txt2);display:flex;align-items:center;gap:6px;}
.console-body{flex:1;overflow-y:auto;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:0.75rem;}
.log-line{padding:2px 6px;border-radius:3px;margin-bottom:3px;line-height:1.5;border-left:2px solid transparent;word-break:break-all;}
.log-line.log{border-left-color:var(--txt3);}
.log-line.warn{color:#fef08a;border-left-color:var(--yellow);}
.log-line.error{color:#fca5a5;border-left-color:var(--red);}

/* ── RESIZER ── */
.resizer{
  width:5px;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border);
  cursor:col-resize;flex-shrink:0;transition:background var(--trans);
}
.resizer:hover,.resizer.drag{background:var(--accent);}

/* ── PREVIEW PANE ── */
.preview-pane{display:flex;flex-direction:column;flex:1;background:var(--bg);overflow:hidden;}
.preview-header{
  height:var(--header-h);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;flex-shrink:0;gap:8px;
}
.preview-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:auto;background:var(--bg);
}
.preview-frame{
  background:#fff;border-radius:10px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  overflow:hidden;width:100%;height:100%;
  transition:width 0.3s,height 0.3s;
  position:relative;
}
.preview-frame.mob{width:375px;height:667px;}
.preview-frame.tab{width:768px;height:1024px;}
.preview-frame.lap{width:1024px;height:768px;}
.sandbox{width:100%;height:100%;border:none;}

/* Design mode overlay border */
.preview-frame.design-on{outline:3px solid var(--accent);}

/* ── BUTTONS ── */
.btn{
  height:28px;padding:0 10px;border-radius:6px;font-size:0.75rem;font-weight:600;
  display:flex;align-items:center;gap:5px;transition:all var(--trans);
  border:1px solid var(--border2);color:var(--txt2);
}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.btn:hover{color:var(--txt);border-color:var(--txt2);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px var(--accent-glow);}
.btn.primary:hover{background:#4a58dc;}
.btn.active-state{background:var(--bg4);color:var(--accent);border-color:var(--accent);}

/* ── PROPS PANEL ── */
.props-panel{
  width:220px;background:var(--bg2);border-left:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
  transition:width var(--trans);
}
.props-panel.closed{width:0;border:none;}
.props-hdr{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;flex-shrink:0;}
.props-title{font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt2);}
.props-body{flex:1;padding:12px;overflow-y:auto;}
.prop-group{margin-bottom:16px;}
.prop-label{font-size:0.65rem;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
.prop-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.prop-name{font-size:0.72rem;color:var(--txt2);}
.prop-input{
  font-size:0.72rem;padding:3px 6px;border-radius:4px;border:1px solid var(--border);
  background:var(--bg3);width:110px;font-family:'JetBrains Mono',monospace;
}
.prop-input:focus{border-color:var(--accent);}
.prop-color{width:30px;height:24px;padding:0;border-radius:4px;border:1px solid var(--border);cursor:pointer;}
.no-selection{text-align:center;padding:24px 12px;color:var(--txt3);font-size:0.78rem;line-height:1.5;}
.tag-chip{
  display:inline-block;font-size:0.7rem;padding:2px 8px;border-radius:12px;
  background:var(--bg4);border:1px solid var(--border2);color:var(--txt2);
  margin-bottom:8px;font-family:'JetBrains Mono',monospace;
}
.add-child-btn{
  width:100%;padding:5px;font-size:0.72rem;border-radius:5px;border:1px dashed var(--border2);
  color:var(--txt3);transition:all var(--trans);margin-top:4px;
}
.add-child-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── COMMAND PALETTE ── */
.cp-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);
  z-index:900;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;
  opacity:0;transition:opacity 0.2s;
}
.cp-overlay.open{display:flex;opacity:1;}
.cp-box{
  background:var(--bg3);border:1px solid var(--border2);border-radius:12px;
  width:90%;max-width:560px;overflow:hidden;
  box-shadow:0 24px 80px rgba(0,0,0,0.7);
  transform:translateY(-10px);transition:transform 0.2s;
}
.cp-overlay.open .cp-box{transform:none;}
.cp-search{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.cp-search svg{width:16px;height:16px;stroke:var(--txt3);fill:none;stroke-width:2;flex-shrink:0;}
.cp-input{flex:1;background:none;border:none;font-size:0.9rem;color:var(--txt);}
.cp-input::placeholder{color:var(--txt3);}
.cp-results{max-height:320px;overflow-y:auto;padding:6px;}
.cp-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background 0.1s;}
.cp-item:hover,.cp-item.sel{background:var(--bg4);}
.cp-icon{width:28px;height:28px;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cp-icon svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2;}
.cp-text .cp-label{font-size:0.82rem;font-weight:600;}
.cp-text .cp-desc{font-size:0.68rem;color:var(--txt3);margin-top:1px;}
.cp-kbd{margin-left:auto;font-size:0.65rem;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--border2);color:var(--txt3);font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.cp-footer{border-top:1px solid var(--border);padding:6px 16px;display:flex;gap:12px;}
.cp-hint{font-size:0.65rem;color:var(--txt3);display:flex;align-items:center;gap:4px;}
.cp-hint kbd{padding:1px 4px;border-radius:3px;background:var(--bg);border:1px solid var(--border2);}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:800;display:none;align-items:center;justify-content:center;}
.modal-backdrop.open{display:flex;}
.modal{background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:24px;width:90%;max-width:420px;}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:8px;}
.modal-desc{font-size:0.8rem;color:var(--txt2);margin-bottom:16px;}
.modal-input{width:100%;padding:8px 12px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;font-size:0.85rem;margin-bottom:16px;}
.modal-input:focus{border-color:var(--accent);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}

/* ── MISC ── */
.label-txt{font-size:0.65rem;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:0.8px;}
select.styled{padding:4px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;font-size:0.75rem;color:var(--txt);}
select.styled:focus{border-color:var(--accent);}
.check-label{display:flex;align-items:center;gap:5px;font-size:0.73rem;color:var(--txt2);cursor:pointer;}
.check-label input{accent-color:var(--accent);}
.empty-state{text-align:center;padding:20px;color:var(--txt3);font-size:0.75rem;}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
  </div>
  <button class="sb-btn on" data-drawer="projects" data-tip="Projects">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
  </button>
  <button class="sb-btn" data-drawer="templates" data-tip="Templates">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
  </button>
  <button class="sb-btn" data-drawer="cdn" data-tip="CDN Manager">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
  </button>
  <button class="sb-btn" data-drawer="history" data-tip="Snapshots">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  </button>
  <button class="sb-btn" data-drawer="export" data-tip="Export">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </button>
  <div class="sb-sep"></div>
  <button class="sb-btn" id="btnTheme" data-tip="Toggle Theme">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <button class="sb-btn" id="btnCP" data-tip="Command Palette (Ctrl+Shift+P)">
    <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
  </button>
</aside>

<!-- DRAWER -->
<div class="drawer" id="drawer">
  <!-- Projects -->
  <div class="d-section active" id="dsec-projects">
    <div class="dh">
      <span class="dh-title">Projects</span>
      <button class="sb-btn" id="btnNewProj" style="width:28px;height:28px;" data-tip="New">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="dc"><div class="proj-list" id="projList"></div></div>
  </div>
  <!-- Templates -->
  <div class="d-section" id="dsec-templates">
    <div class="dh"><span class="dh-title">Templates</span></div>
    <div class="dc" id="tplGrid"></div>
  </div>
  <!-- CDN -->
  <div class="d-section" id="dsec-cdn">
    <div class="dh"><span class="dh-title">CDN Libraries</span></div>
    <div class="dc">
      <div id="cdnList"></div>
      <div class="cdn-add-row">
        <input class="cdn-input" id="cdnInput" placeholder="https://cdn.example.com/lib.js">
        <button class="small-btn" id="btnAddCdn">Add</button>
      </div>
      <div style="margin-top:10px;">
        <div class="label-txt" style="margin-bottom:6px;">Quick Presets</div>
        <div class="preset-wrap" id="presetWrap"></div>
      </div>
    </div>
  </div>
  <!-- Snapshots -->

function loadState() {
  const raw = localStorage.getItem('codeforge_v3');
  if (raw) { try { S = JSON.parse(raw); } catch(e){} }
  if (!S.cdns) S.cdns = [];
  if (!S.projects || !Object.keys(S.projects).length) {
    const id = 'p_' + Date.now();
    S.projects = { [id]: { name:'Demo – Particles', html:STARTER.html, css:STARTER.css, js:STARTER.js, snaps:[], updated:Date.now() } };
    S.activeId = id;
    saveState();
  }
  if (!S.activeId || !S.projects[S.activeId]) S.activeId = Object.keys(S.projects)[0];
}
function saveState() { localStorage.setItem('codeforge_v3', JSON.stringify(S)); }
function activeProj() { return S.projects[S.activeId]; }

let mHtml, mCss, mJs, curTab = 'html';
let autoRunTimer = null;
let syncLock = false;

function initMonaco() {
  require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
  require(['vs/editor/editor.main'], () => {
    const p = activeProj();
    mHtml = monaco.editor.createModel(p.html, 'html');
    mCss  = monaco.editor.createModel(p.css,  'css');
    mJs   = monaco.editor.createModel(p.js,   'javascript');

    monaco.languages.typescript.javascriptDefaults.setCompilerOptions({
      target: monaco.languages.typescript.ScriptTarget.ES2020,
      allowNonTsExtensions: true,
      lib: ['es2020', 'dom']
    });

    // Custom JS snippets
    monaco.languages.registerCompletionItemProvider('javascript', {
      provideCompletionItems: (model, pos) => {
        const w = model.getWordUntilPosition(pos);
        const range = { startLineNumber:pos.lineNumber, endLineNumber:pos.lineNumber, startColumn:w.startColumn, endColumn:w.endColumn };
        return { suggestions: [
          {label:'qs',kind:monaco.languages.CompletionItemKind.Snippet,insertText:"document.querySelector('${1}')",insertTextRules:4,documentation:'querySelector',range},
          {label:'qsa',kind:monaco.languages.CompletionItemKind.Snippet,insertText:"document.querySelectorAll('${1}')",insertTextRules:4,documentation:'querySelectorAll',range},
          {label:'ael',kind:monaco.languages.CompletionItemKind.Snippet,insertText:"${1:el}.addEventListener('${2:click}', (e) => {\n\t$0\n});",insertTextRules:4,documentation:'addEventListener',range},
          {label:'raf',kind:monaco.languages.CompletionItemKind.Snippet,insertText:"requestAnimationFrame(function loop() {\n\t$0\n\trequestAnimationFrame(loop);\n});",insertTextRules:4,documentation:'rAF loop',range},
          {label:'cl',kind:monaco.languages.CompletionItemKind.Snippet,insertText:"console.log($1);",insertTextRules:4,documentation:'console.log',range},
          {label:'iife',kind:monaco.languages.CompletionItemKind.Snippet,insertText:"(function() {\n\t'use strict';\n\t$0\n})();",insertTextRules:4,documentation:'IIFE',range},
        ]};
      }
    });

    window.editor = monaco.editor.create(document.getElementById('monacoMount'), {
      model: mHtml, theme:'vs-dark',
      automaticLayout:true,
      fontSize:13,
      fontFamily:"'JetBrains Mono',Consolas,monospace",
      fontLigatures:true,
      tabSize:2,
      lineNumbers:'on',
      minimap:{enabled:false},
      bracketPairColorization:{enabled:true},
      autoClosingBrackets:'always',
      autoClosingTags:true,
      folding:true,
      wordWrap:'on',
      suggestOnTriggerCharacters:true,
      quickSuggestions:{other:true,comments:false,strings:true},
      inlineSuggest:{enabled:true},
      scrollBeyondLastLine:false,
    });

    window.editor.onDidChangeModelContent(() => {
      if (syncLock) return;
      const val = window.editor.getValue();
      const p = activeProj();
      if (curTab === 'html') p.html = val;
      else if (curTab === 'css') p.css = val;
      else p.js = val;
      p.updated = Date.now();
      if (document.getElementById('chkAutoSave').checked) saveState();
      if (document.getElementById('chkAutoRun').checked) {
        clearTimeout(autoRunTimer);
        autoRunTimer = setTimeout(buildPreview, 700);
      }
    });

    window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, buildPreview);
    window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, saveSnap);
    window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyP, openCP);
    window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Digit1, () => switchTab('html'));
    window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Digit2, () => switchTab('css'));
    window.editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Digit3, () => switchTab('js'));

    buildPreview();
  });
}

function switchTab(t) {
  if (t === curTab) return;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('on', el.dataset.tab === t));
  curTab = t;
  window.editor.setModel(t === 'html' ? mHtml : t === 'css' ? mCss : mJs);
}

   PREVIEW BUILD
═══════════════════════════════════════ */
let designMode = false;
let selectedPath = null; // CSS selector path of selected element

function cdnTags() {
  return S.cdns.map(l => l.type === 'stylesheet'
    ? `<link rel="stylesheet" href="${l.url}">`
    : `<script src="${l.url}"><\/script>`
  ).join('\n');
}

function buildPreview() {
  if (!mHtml) return;
  const html = mHtml.getValue();
  const css  = mCss.getValue();
  const js   = mJs.getValue();

  const designScript = designMode ? `
  <style>
    [data-cfs-hover] { outline: 2px dashed rgba(91,106,240,0.5) !important; cursor: pointer !important; }
    [data-cfs-selected] { outline: 2px solid #5b6af0 !important; }
  </style>
  <script>
    let _sel = null;
    function _path(el) {
      if (!el || el === document.body) return 'body';
      const tag = el.tagName.toLowerCase();
      const par = el.parentElement;
      const siblings = par ? Array.from(par.children).filter(c => c.tagName === el.tagName) : [];
      const idx = siblings.indexOf(el);
      const nthStr = siblings.length > 1 ? ':nth-of-type(' + (idx+1) + ')' : '';
      return _path(par) + ' > ' + tag + nthStr;
    }
    document.addEventListener('mouseover', e => {
      const el = e.target; if (el === document.body || el === document.documentElement) return;
      el.setAttribute('data-cfs-hover','1');
      e.stopPropagation();
    }, true);
    document.addEventListener('mouseout', e => { e.target.removeAttribute('data-cfs-hover'); }, true);
    document.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      if (_sel) _sel.removeAttribute('data-cfs-selected');
      _sel = e.target;
      if (_sel === document.body || _sel === document.documentElement) { _sel = null; return; }
      _sel.setAttribute('data-cfs-selected','1');
      const cs = window.getComputedStyle(_sel);
      const rect = _sel.getBoundingClientRect();
      window.parent.postMessage({
        type:'select',
        path: _path(_sel),
        tag: _sel.tagName.toLowerCase(),
        text: _sel.childNodes.length === 1 && _sel.childNodes[0].nodeType === 3 ? _sel.textContent : null,
        innerHTML: _sel.innerHTML,
        styles: {
          color: cs.color,
          backgroundColor: cs.backgroundColor,
          fontSize: cs.fontSize,
          fontWeight: cs.fontWeight,
          padding: cs.padding,
          margin: cs.margin,
          borderRadius: cs.borderRadius,
          textAlign: cs.textAlign,
          display: cs.display,
          width: cs.width,
          height: cs.height,
          opacity: cs.opacity,
        },
        attrs: {
          id: _sel.id || '',
          className: _sel.className || '',
          href: _sel.href || '',
          src: _sel.src || '',
        }
      }, '*');
    }, true);
  <\/script>` : '';

  const srcdoc = `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
${cdnTags()}
<style>${css}</style>
${designScript}
</head><body>
${html}
<script>
(function(){
  var _l=console.log,_w=console.warn,_e=console.error;
  function _s(t,a){window.parent.postMessage({type:'log',lt:t,msg:a.map(x=>x===null?'null':x===undefined?'undefined':typeof x==='object'?JSON.stringify(x):String(x)).join(' ')},'*');}
  console.log=(...a)=>{_l(...a);_s('log',a);};
  console.warn=(...a)=>{_w(...a);_s('warn',a);};
  console.error=(...a)=>{_e(...a);_s('error',a);};
  window.onerror=(m,u,l)=>{_s('error',[m+' (line '+l+')']);};
})();
<\/script>
<script>try{${js}}catch(err){console.error(err.message);}<\/script>
</body></html>`;

  document.getElementById('sandbox').srcdoc = srcdoc;
}

function rgbToHex(rgb) {
  if (!rgb || rgb === 'transparent' || !rgb.startsWith('rgb')) return '#000000';
  const parts = rgb.match(/\d+/g);
  if (!parts || parts.length < 3) return '#000000';
  return '#' + parts.slice(0,3).map(n => parseInt(n).toString(16).padStart(2,'0')).join('');
}

function escHtml(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── inject or update CSS rule for a selector ─── */
function injectStyleToCss(path, tag, prop, val) {
  // Build a sensible selector from the path
  const sel = buildCssSelector(path);
  let css = mCss.getValue();

  // Try to find existing rule block for this selector
  const escapedSel = sel.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const ruleRe = new RegExp('(' + escapedSel + '\\s*\\{[^}]*)(' + prop.replace(/-/g,'\\-') + '\\s*:[^;]*;)?', '');
  
  if (ruleRe.test(css)) {
    // Update or insert property inside existing block
    const propRe = new RegExp('(' + escapedSel + '\\s*\\{[^}]*)(' + prop.replace(/-/g,'\\-') + '\\s*:[^;]*;)', 'g');
    if (propRe.test(css)) {
      css = css.replace(propRe, (m, pre, oldProp) => pre + prop + ': ' + val + ';');
    } else {
      // Insert before closing brace of the block
      css = css.replace(new RegExp('(' + escapedSel + '\\s*\\{[^}]*)\\}'), (m, pre) => pre + '\n  ' + prop + ': ' + val + ';\n}');
    }
  } else {
    // Append a new rule
    css += '\n\n' + sel + ' {\n  ' + prop + ': ' + val + ';\n}';
  }

  syncLock = true;
  mCss.setValue(css);
  activeProj().css = css;
  syncLock = false;

  // Switch to CSS tab to show the change
  switchTab('css');
  buildPreview();
  setTimeout(() => switchTab('css'), 100);
}

function buildCssSelector(path) {
  // Convert the path from the iframe into a reasonable selector
  // Keep it simple: use the last 1-2 segments
  const parts = path.split(' > ').filter(Boolean);
  if (parts.length <= 2) return parts.join(' > ');
  return parts.slice(-2).join(' > ');
}

/* ─── apply text content change to HTML ─── */
function applyTextContent(path, newText) {
  applyInnerHTML(path, newText);
}

function applyInnerHTML(path, newHtml) {
  // We'll inject a tiny script to the iframe that updates the element
  // and then syncs back the full body HTML
  const iframe = document.getElementById('sandbox');
  const msg = { type: 'apply-html', path, html: newHtml };
  iframe.contentWindow.postMessage(msg, '*');
}

/* ─── Update HTML model from iframe sync ─── */
function syncHtmlFromPreview(bodyHtml) {
  if (!mHtml) return;
  const current = mHtml.getValue();
  // Extract body content only
  const bodyMatch = current.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  if (bodyMatch) {
    const newFull = current.replace(/<body[^>]*>[\s\S]*<\/body>/i, '<body>\n' + bodyHtml + '\n</body>');
    syncLock = true;
    mHtml.setValue(newFull);
    activeProj().html = newFull;
    syncLock = false;
    switchTab('html');
  } else {
    syncLock = true;
    mHtml.setValue(bodyHtml);
    activeProj().html = bodyHtml;
    syncLock = false;
  }
  setTimeout(() => {
    window.editor && window.editor.getAction('editor.action.formatDocument') && window.editor.getAction('editor.action.formatDocument').run();
  }, 100);
}

    S.projects[id] = { name: name||'New Project', html:'<h1>Hello</h1>', css:'body{background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;}h1{font-size:2rem;}', js:'console.log("Ready");', snaps:[], updated:Date.now() };

window.dupProj = function(id) {
  const src = S.projects[id];
  const nid = 'p_' + Date.now();
  S.projects[nid] = { name: src.name + ' (copy)', html:src.html, css:src.css, js:src.js, snaps:[], updated:Date.now() };
  saveState(); renderProjects();
};
window.delProj = function(id) {
  if (Object.keys(S.projects).length <= 1) { alert('Cannot delete the last project!'); return; }
  if (!confirm('Delete this project?')) return;
  delete S.projects[id];
  if (S.activeId === id) S.activeId = Object.keys(S.projects)[0];
  loadProj(S.activeId);
};

═══════════════════════════════════════ */
function renderTemplates() {
  const grid = document.getElementById('tplGrid');
  grid.innerHTML = '';
  TEMPLATES.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tpl-card';
    el.innerHTML = `<div class="tpl-name">${t.name}</div><div class="tpl-desc">${t.desc}</div><div class="tpl-tags">${t.tags.map(x=>`<span class="tpl-tag">${x}</span>`).join('')}</div>`;
    el.addEventListener('click', () => applyTemplate(t));
    grid.appendChild(el);
  });
}
function applyTemplate(t) {
  const id = 'p_' + Date.now();
  S.projects[id] = { name:t.name+' – '+new Date().toLocaleDateString(), html:t.html, css:t.css, js:t.js, snaps:[], updated:Date.now() };
  loadProj(id);
  document.querySelector('.sb-btn[data-drawer="projects"]').click();
  addLog('log', 'Template applied: ' + t.name);
}

/* ═══════════════════════════════════════
   CDN
═══════════════════════════════════════ */
function renderCdnList() {
  const list = document.getElementById('cdnList');
  if (!S.cdns.length) { list.innerHTML = '<div class="empty-state">No CDNs added yet.</div>'; return; }
  list.innerHTML = S.cdns.map((c, i) => `
    <div class="cdn-item-row">
      <span class="cdn-badge ${c.type === 'stylesheet' ? 'css' : 'js'}">${c.type === 'stylesheet' ? 'CSS' : 'JS'}</span>
      <span class="cdn-url" title="${c.url}">${c.url}</span>
      <button class="cdn-rm" onclick="removeCdn(${i})">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  `).join('');
}
function renderPresets() {
  const wrap = document.getElementById('presetWrap');
  wrap.innerHTML = CDN_PRESETS.map(p => {
    const added = S.cdns.some(c => c.url === p.url);
    return `<button class="preset-chip ${added?'added':''}" onclick="addPreset('${p.url}','${p.type}','${p.name}')">${p.name}</button>`;
  }).join('');
}
window.addPreset = function(url, type, name) {
  if (S.cdns.some(c => c.url === url)) return;
  S.cdns.push({url, type}); saveState(); renderCdnList(); renderPresets();
  addLog('log', 'CDN added: ' + name);
};
window.removeCdn = function(i) {
  S.cdns.splice(i, 1); saveState(); renderCdnList(); renderPresets();
};
document.getElementById('btnAddCdn').addEventListener('click', () => {
  const input = document.getElementById('cdnInput');
  const url = input.value.trim();
  if (!url || !url.startsWith('http')) { alert('Enter a valid CDN URL.'); return; }
  if (S.cdns.some(c => c.url === url)) { alert('Already added.'); return; }
  const type = url.endsWith('.css') ? 'stylesheet' : 'script';
  S.cdns.push({url, type}); saveState(); renderCdnList(); renderPresets();
  input.value = ''; addLog('log', 'CDN added: ' + url);
});
document.getElementById('cdnInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnAddCdn').click(); });

/* ═══════════════════════════════════════
   SNAPSHOTS
═══════════════════════════════════════ */
function renderSnaps() {
  const list = document.getElementById('snapList');
  const p = activeProj();
  if (!p.snaps || !p.snaps.length) { list.innerHTML = '<div class="empty-state">No snapshots yet. Press Ctrl+S to save one.</div>'; return; }
  list.innerHTML = p.snaps.slice().reverse().map((sn, ri) => {
    const i = p.snaps.length - 1 - ri;
    return `<div class="snap-item">
      <div><div class="snap-meta">Version ${p.snaps.length - ri}</div><div class="snap-time">${new Date(sn.ts).toLocaleTimeString()}</div></div>
      <button class="snap-restore" onclick="restoreSnap(${i})">Restore</button>
    </div>`;
  }).join('');
}

function saveSnap() {
  const p = activeProj();
  if (!p.snaps) p.snaps = [];
  p.snaps.push({ ts:Date.now(), html:mHtml.getValue(), css:mCss.getValue(), js:mJs.getValue() });
  saveState(); renderSnaps();
  addLog('log', 'Snapshot saved.');
}
document.getElementById('btnNewSnap').addEventListener('click', saveSnap);

window.restoreSnap = function(i) {
  const sn = activeProj().snaps[i];
  if (!sn || !confirm('Restore to this snapshot?')) return;
  mHtml.setValue(sn.html); mCss.setValue(sn.css); mJs.setValue(sn.js);
  buildPreview(); addLog('log', 'Restored to snapshot.');
};

document.getElementById('btnImport').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.html !== undefined) {
        const id = 'p_' + Date.now();
        S.projects[id] = { name:d.name||'Imported', html:d.html, css:d.css||'', js:d.js||'', snaps:[], updated:Date.now() };
        loadProj(id); alert('Imported!');
      } else alert('Invalid format.');
    } catch(err) { alert('Parse error.'); }
  };
  r.readAsText(f);
});

document.getElementById('btnExportHTML').addEventListener('click', () => {
  const p = activeProj();
  const doc = `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<title>${p.name}</title>\n${cdnTags()}\n<style>\n${p.css}\n</style>\n</head>\n<body>\n${p.html}\n<script>\n${p.js}\n<\/script>\n</body>\n</html>`;
  dl(doc, p.name.replace(/\s+/g,'_') + '.html', 'text/html');
});

document.getElementById('btnExportZip').addEventListener('click', () => {
  const p = activeProj();
  const zip = new JSZip();
  const doc = `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<title>${p.name}</title>\n${cdnTags()}\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n${p.html}\n<script src="script.js"><\/script>\n</body>\n</html>`;
  zip.file('index.html', doc);
  zip.file('style.css', p.css);
  zip.file('script.js', p.js);
  zip.generateAsync({type:'blob'}).then(blob => dl(blob, p.name.replace(/\s+/g,'_') + '.zip', 'application/zip'));
});

function dl(content, name, type) {
  const blob = content instanceof Blob ? content : new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

const cpOverlay = document.getElementById('cpOverlay');
const cpInput = document.getElementById('cpInput');
const cpResults = document.getElementById('cpResults');
let cpIdx = 0, cpFiltered = [];

function openCP() {
  cpOverlay.classList.add('open');
  cpInput.value = '';
  filterCP('');
  setTimeout(() => cpInput.focus(), 30);
}
function closeCP() { cpOverlay.classList.remove('open'); }
function filterCP(q) {
  const lq = q.toLowerCase();
  cpFiltered = q ? COMMANDS.filter(c => c.label.toLowerCase().includes(lq) || c.desc.toLowerCase().includes(lq)) : COMMANDS.slice(0,12);
  cpIdx = 0; renderCP();
}
function renderCP() {
  if (!cpFiltered.length) { cpResults.innerHTML = '<div style="text-align:center;padding:20px;color:var(--txt3);font-size:0.8rem;">No commands found.</div>'; return; }
  cpResults.innerHTML = cpFiltered.map((c, i) => `
    <div class="cp-item${i===cpIdx?' sel':''}" data-i="${i}">
      <div class="cp-icon"><svg viewBox="0 0 24 24">${c.icon}</svg></div>
      <div class="cp-text"><div class="cp-label">${c.label}</div><div class="cp-desc">${c.desc}</div></div>
      ${c.kbd ? `<span class="cp-kbd">${c.kbd}</span>` : ''}
    </div>
  `).join('');
  cpResults.querySelectorAll('.cp-item').forEach((el, i) => {
    el.addEventListener('click', () => runCp(cpFiltered[i]));
    el.addEventListener('mouseenter', () => { cpIdx = i; renderCP(); });
  });
  const sel = cpResults.querySelector('.sel');
  sel && sel.scrollIntoView({block:'nearest'});
}
function runCp(cmd) { closeCP(); setTimeout(() => cmd.action(), 80); }

cpInput.addEventListener('input', e => filterCP(e.target.value));
cpInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cpIdx = Math.min(cpIdx+1, cpFiltered.length-1); renderCP(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cpIdx = Math.max(cpIdx-1, 0); renderCP(); }
  else if (e.key === 'Enter') { cpFiltered[cpIdx] && runCp(cpFiltered[cpIdx]); }
  else if (e.key === 'Escape') closeCP();
});
cpOverlay.addEventListener('click', e => { if (e.target === cpOverlay) closeCP(); });
document.getElementById('btnCP').addEventListener('click', openCP);

document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==='p') { e.preventDefault(); cpOverlay.classList.contains('open') ? closeCP() : openCP(); }
  if (e.key === 'Escape') { closeCP(); document.getElementById('modalBd').classList.remove('open'); }
});

/* ═══════════════════════════════════════
   ADDITIONAL IFRAME MESSAGE HANDLING
   (Apply HTML changes from props panel)
═══════════════════════════════════════ */
// Inject a listener into the iframe for apply-html messages
// We do this by rebuilding the preview with an extra listener
window.addEventListener('message', e => {
  if (!e.data) return;
  if (e.data.type === 'apply-html') {
    // This won't arrive here directly since we send to iframe
    // The iframe sends back the updated body
  }
  if (e.data.type === 'body-updated') {
    syncHtmlFromPreview(e.data.html);
    buildPreview();
  }
});

// Override buildPreview to include the apply-html handler in the iframe
const _origBuildPreview = buildPreview;
function buildPreviewFull() {
  if (!mHtml) return;
  const html = mHtml.getValue();
  const css  = mCss.getValue();
  const js   = mJs.getValue();

  const designHooks = designMode ? `
  <style>
    [data-cfs-hover]{outline:2px dashed rgba(91,106,240,0.5)!important;cursor:pointer!important;}
    [data-cfs-selected]{outline:2px solid #5b6af0!important;}
  </style>
  <script>
    let _sel=null;
    function _path(el){if(!el||el===document.body)return 'body';const tag=el.tagName.toLowerCase();const par=el.parentElement;const sibs=par?Array.from(par.children).filter(c=>c.tagName===el.tagName):[];const idx=sibs.indexOf(el);const nth=sibs.length>1?':nth-of-type('+(idx+1)+')':'';return _path(par)+' > '+tag+nth;}
    document.addEventListener('mouseover',e=>{const el=e.target;if(el===document.body||el===document.documentElement)return;el.setAttribute('data-cfs-hover','1');e.stopPropagation();},true);
    document.addEventListener('mouseout',e=>{e.target.removeAttribute('data-cfs-hover');},true);
    document.addEventListener('click',e=>{
      e.preventDefault();e.stopPropagation();
      if(_sel)_sel.removeAttribute('data-cfs-selected');
      _sel=e.target;
      if(_sel===document.body||_sel===document.documentElement){_sel=null;return;}
      _sel.setAttribute('data-cfs-selected','1');
      const cs=window.getComputedStyle(_sel);
      const isTextOnly=_sel.childNodes.length===1&&_sel.childNodes[0].nodeType===3;
      window.parent.postMessage({type:'select',path:_path(_sel),tag:_sel.tagName.toLowerCase(),text:isTextOnly?_sel.textContent:null,innerHTML:_sel.innerHTML,styles:{color:cs.color,backgroundColor:cs.backgroundColor,fontSize:cs.fontSize,fontWeight:cs.fontWeight,padding:cs.padding,margin:cs.margin,borderRadius:cs.borderRadius,textAlign:cs.textAlign,display:cs.display,width:cs.width,height:cs.height,opacity:cs.opacity},attrs:{id:_sel.id||'',className:_sel.className||'',href:_sel.href||'',src:_sel.src||''}},'*');
    },true);
    // Listen for apply-html from parent
    window.addEventListener('message',e=>{
      if(!e.data)return;
      if(e.data.type==='apply-html'){
        try{
          const path=e.data.path;
          const parts=path.split(' > ').filter(Boolean);
          let el=document.body;
          for(let i=1;i<parts.length;i++){
            const seg=parts[i];
            const nthM=seg.match(/([a-z]+):nth-of-type\\((\\d+)\\)/);
            if(nthM){const tag=nthM[1];const n=parseInt(nthM[2]);const children=Array.from(el.children).filter(c=>c.tagName.toLowerCase()===tag);el=children[n-1]||el;}
            else{const found=el.querySelector(seg);if(found)el=found;}
          }
          el.innerHTML=e.data.html;
          window.parent.postMessage({type:'body-updated',html:document.body.innerHTML},'*');
        }catch(err){console.error('apply-html error:',err);}
      }
    });
  <\/script>` : '';

  const srcdoc = `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
${cdnTags()}
<style>${css}</style>
${designHooks}
</head><body>
${html}
<script>
(function(){
  var _l=console.log,_w=console.warn,_e=console.error;
  function _s(t,a){window.parent.postMessage({type:'log',lt:t,msg:a.map(x=>x===null?'null':x===undefined?'undefined':typeof x==='object'?JSON.stringify(x):String(x)).join(' ')},'*');}
  console.log=function(){_l.apply(this,arguments);_s('log',[].slice.call(arguments));};
  console.warn=function(){_w.apply(this,arguments);_s('warn',[].slice.call(arguments));};
  console.error=function(){_e.apply(this,arguments);_s('error',[].slice.call(arguments));};
  window.onerror=function(m,u,l){_s('error',[m+' (line '+l+')']);};
})();
<\/script>
<script>try{${js}}catch(err){console.error(err.message);}<\/script>
</body></html>`;

  document.getElementById('sandbox').srcdoc = srcdoc;
}
