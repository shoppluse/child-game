<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge Studio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldgutter.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --bg-header: #252526;
            --text-main: #cccccc;
            --text-muted: #858585;
            --accent: #007acc;
            --accent-hover: #005f9e;
            --border: #333333;
            --danger: #f48771;
            --success: #89d185;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-header);
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border);
            height: 50px;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
        }

        .brand i { color: var(--accent); }

        .toolbar-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .btn {
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #2a2d2e;
            border-color: #454545;
        }

        .btn.primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn.primary:hover {
            background-color: var(--accent-hover);
        }

        .device-toggles {
            display: flex;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .device-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            cursor: pointer;
        }

        .device-btn.active {
            background: var(--border);
            color: #fff;
        }

        /* Main Workspace */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
            overflow: hidden;
        }

        /* Left Panel - Preview */
        .panel-preview {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #000;
            position: relative;
        }

        .preview-header {
            background-color: var(--bg-header);
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .iframe-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #2a2a2a 0%, #121212 100%);
            overflow: auto;
            padding: 1rem;
        }

        iframe {
            background-color: #fff;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: width 0.3s, height 0.3s;
            width: 100%;
            height: 100%;
        }

        /* Console Panel */
        .console-panel {
            height: 200px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .console-header {
            padding: 0.3rem 1rem;
            background-color: var(--bg-header);
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .console-output {
            flex: 1;
            padding: 0.5rem;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
        }

        .log-entry { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid #333; }
        .log-error { color: var(--danger); }
        .log-warn { color: #cca700; }
        
        /* Resizer */
        .resizer {
            width: 6px;
            background-color: var(--bg-header);
            cursor: col-resize;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            z-index: 10;
        }
        .resizer:hover, .resizer:active {
            background-color: var(--accent);
        }

        /* Right Panel - Code Editor */
        .panel-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-panel);
            width: 50%;
        }

        .tabs {
            display: flex;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-right: 1px solid var(--border);
            border-bottom: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab:hover { color: var(--text-main); }
        .tab.active {
            color: #fff;
            background-color: var(--bg-panel);
            border-bottom-color: var(--accent);
        }

        .tab-icon.html { color: #e34c26; }
        .tab-icon.css { color: #264de4; }
        .tab-icon.js { color: #f0db4f; }

        .editor-container {
            flex: 1;
            position: relative;
        }

        .editor-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
        }

        .editor-wrapper.active { display: block; }

        /* CodeMirror Overrides */
        .CodeMirror {
            height: 100%;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <i class="fa-solid fa-fire-flame-curved"></i> CodeForge Studio
        </div>
        
        <div class="toolbar-group">
            <div class="device-toggles">
                <button class="device-btn active" onclick="setDevice('desktop')" title="Desktop"><i class="fa-solid fa-desktop"></i></button>
                <button class="device-btn" onclick="setDevice('tablet')" title="Tablet"><i class="fa-solid fa-tablet-screen-button"></i></button>
                <button class="device-btn" onclick="setDevice('mobile')" title="Mobile"><i class="fa-solid fa-mobile-screen"></i></button>
            </div>
        </div>

        <div class="toolbar-group">
            <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                <input type="checkbox" id="autoRun" checked> Auto Run
            </label>
            <button class="btn" onclick="saveProject()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
            <button class="btn" onclick="exportProject()"><i class="fa-solid fa-download"></i> Export</button>
            <button class="btn primary" onclick="runCode()"><i class="fa-solid fa-play"></i> Run</button>
        </div>
    </nav>

    <div class="workspace">
        
        <div class="panel-preview" id="leftPanel">
            <div class="preview-header">
                <span><i class="fa-solid fa-eye"></i> Live Output</span>
                <span id="previewSize">Responsive</span>
            </div>
            
            <div class="iframe-container">
                <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-pointer-lock allow-same-origin allow-popups allow-forms"></iframe>
            </div>

            <div class="console-panel">
                <div class="console-header">
                    <span><i class="fa-solid fa-terminal"></i> Console</span>
                    <button style="background:none; border:none; color:var(--text-muted); cursor:pointer;" onclick="clearConsole()"><i class="fa-solid fa-ban"></i></button>
                </div>
                <div class="console-output" id="consoleOutput"></div>
            </div>
        </div>

        <div class="resizer" id="resizer"></div>

        <div class="panel-editor" id="rightPanel">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('html')"><i class="fa-brands fa-html5 tab-icon html"></i> index.html</div>
                <div class="tab" onclick="switchTab('css')"><i class="fa-brands fa-css3-alt tab-icon css"></i> style.css</div>
                <div class="tab" onclick="switchTab('js')"><i class="fa-brands fa-js tab-icon js"></i> script.js</div>
            </div>
            
            <div class="editor-container">
                <div class="editor-wrapper active" id="wrap-html">
                    <textarea id="editor-html"></textarea>
                </div>
                <div class="editor-wrapper" id="wrap-css">
                    <textarea id="editor-css"></textarea>
                </div>
                <div class="editor-wrapper" id="wrap-js">
                    <textarea id="editor-js"></textarea>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldgutter.min.js"></script>

    <script>
        // --- 1. Initialize Editors (CodeMirror) ---
        const editorOptions = {
            theme: 'material-darker',
            lineNumbers: true,
            autoCloseBrackets: true,
            autoCloseTags: true,
            foldGutter: true,
            gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
            lineWrapping: true
        };

        const htmlEditor = CodeMirror.fromTextArea(document.getElementById('editor-html'), {
            ...editorOptions, mode: 'xml'
        });
        const cssEditor = CodeMirror.fromTextArea(document.getElementById('editor-css'), {
            ...editorOptions, mode: 'css'
        });
        const jsEditor = CodeMirror.fromTextArea(document.getElementById('editor-js'), {
            ...editorOptions, mode: 'javascript'
        });

        // Load Default Content
        htmlEditor.setValue(`<div class="hero">\n  <h1>CodeForge Studio</h1>\n  <p>Build advanced graphics and modern UIs.</p>\n  <canvas id="particles"></canvas>\n</div>`);
        cssEditor.setValue(`.hero {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  height: 100vh;\n  background: #111;\n  color: #fff;\n  font-family: sans-serif;\n}\ncanvas {\n  position: absolute;\n  top: 0; left: 0;\n  width: 100%; height: 100%;\n  pointer-events: none;\n}`);
        jsEditor.setValue(`// Particle System Demo\nconst ctx = document.getElementById('particles').getContext('2d');\nconsole.log("Canvas initialized successfully!");`);

        // --- 2. Tab Switching Logic ---
        function switchTab(lang) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.editor-wrapper').forEach(e => e.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(`wrap-${lang}`).classList.add('active');
            
            // Refresh CodeMirror to fix layout bugs when hidden
            if(lang === 'html') htmlEditor.refresh();
            if(lang === 'css') cssEditor.refresh();
            if(lang === 'js') jsEditor.refresh();
        }

        // --- 3. Preview Execution Logic ---
        let timeout;
        function setupAutoRun() {
            htmlEditor.on('change', debounceRun);
            cssEditor.on('change', debounceRun);
            jsEditor.on('change', debounceRun);
        }

        function debounceRun() {
            if (document.getElementById('autoRun').checked) {
                clearTimeout(timeout);
                timeout = setTimeout(runCode, 800);
            }
        }

        function runCode() {
            const iframe = document.getElementById('preview-frame');
            const html = htmlEditor.getValue();
            const css = cssEditor.getValue();
            const js = jsEditor.getValue();

            // Script injected to capture console.log inside the iframe
            const consoleCaptureScript = `
                <script>
                    const originalConsole = {
                        log: console.log,
                        warn: console.warn,
                        error: console.error
                    };
                    
                    function postConsoleMsg(type, args) {
                        const message = Array.from(args).map(arg => 
                            typeof arg === 'object' ? JSON.stringify(arg) : String(arg)
                        ).join(' ');
                        window.parent.postMessage({ source: 'codeforge', type: type, message: message }, '*');
                    }

                    console.log = function(...args) { postConsoleMsg('log', args); originalConsole.log.apply(console, args); };
                    console.warn = function(...args) { postConsoleMsg('warn', args); originalConsole.warn.apply(console, args); };
                    console.error = function(...args) { postConsoleMsg('error', args); originalConsole.error.apply(console, args); };
                    
                    window.onerror = function(message, source, lineno, colno, error) {
                        postConsoleMsg('error', [\`\${message} at line \${lineno}\`]);
                        return false;
                    };
                <\/script>
            `;

            const combinedSource = `
                <!DOCTYPE html>
                <html>
                <head>
                    ${consoleCaptureScript}
                    <style>${css}</style>
                </head>
                <body>
                    ${html}
                    <script>${js}<\/script>
                </body>
                </html>
            `;

            iframe.srcdoc = combinedSource;
        }

        // --- 4. Console Interception ---
        const consoleOutput = document.getElementById('consoleOutput');
        
        window.addEventListener('message', (e) => {
            if (e.data && e.data.source === 'codeforge') {
                const div = document.createElement('div');
                div.className = \`log-entry log-\${e.data.type}\`;
                
                const time = new Date().toLocaleTimeString([], {hour12:false});
                div.innerText = \`[\${time}] \${e.data.message}\`;
                
                consoleOutput.appendChild(div);
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }
        });

        function clearConsole() {
            consoleOutput.innerHTML = '';
        }

        // --- 5. Splitter Drag Logic ---
        const resizer = document.getElementById('resizer');
        const leftPanel = document.getElementById('leftPanel');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerWidth = document.body.clientWidth;
            const newLeftWidth = (e.clientX / containerWidth) * 100;
            if (newLeftWidth > 20 && newLeftWidth < 80) {
                leftPanel.style.flex = \`0 0 \${newLeftWidth}%\`;
            }
        });

        document.addEventListener('mouseup', () => {
            isResizing = false;
            document.body.style.cursor = 'default';
        });

        // --- 6. Device Toggles ---
        function setDevice(type) {
            document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const iframe = document.getElementById('preview-frame');
            const sizeLabel = document.getElementById('previewSize');
            
            if (type === 'mobile') {
                iframe.style.width = '375px';
                iframe.style.height = '812px';
                sizeLabel.innerText = 'Mobile (375x812)';
            } else if (type === 'tablet') {
                iframe.style.width = '768px';
                iframe.style.height = '1024px';
                sizeLabel.innerText = 'Tablet (768x1024)';
            } else {
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                sizeLabel.innerText = 'Responsive';
            }
        }

        // --- 7. Save / Export features ---
        function saveProject() {
            const project = {
                html: htmlEditor.getValue(),
                css: cssEditor.getValue(),
                js: jsEditor.getValue()
            };
            localStorage.setItem('codeforge_project', JSON.stringify(project));
            alert("Project saved locally!");
        }

        function loadProject() {
            const saved = localStorage.getItem('codeforge_project');
            if (saved) {
                const project = JSON.parse(saved);
                htmlEditor.setValue(project.html);
                cssEditor.setValue(project.css);
                jsEditor.setValue(project.js);
            }
        }

        function exportProject() {
            const html = htmlEditor.getValue();
            const css = cssEditor.getValue();
            const js = jsEditor.getValue();
            
            const content = `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>Exported Project</title>\n<style>\n${css}\n</style>\n</head>\n<body>\n${html}\n<script>\n${js}\n<\/script>\n</body>\n</html>`;
            
            const blob = new Blob([content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'project.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Initialize
        loadProject();
        setupAutoRun();
        runCode(); // Initial run

    </script>
</body>
</html>
